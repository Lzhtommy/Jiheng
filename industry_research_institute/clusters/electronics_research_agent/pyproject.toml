[project]
name = "electronics-research-agent"
version = "0.1.0"
description = "Self-contained Shenwan electronics (L1 chief / L2 supervisor / L3 researcher) agent cluster"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PyYAML>=6.0",
    "psycopg2-binary>=2.9",
]

[project.scripts]
electronics-research-agent = "electronics_research_agent.orchestrator.run:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
