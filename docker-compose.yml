services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${VR_PG_USER:-postgres}
      POSTGRES_PASSWORD: ${VR_PG_PASSWORD:-postgres}
      POSTGRES_DB: ${VR_PG_DATABASE:-thronepath_pg}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${VR_PG_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10
  java:
    build: ./jiheng-java
    environment:
      REDIS_HOST: redis
      # 留空则连本服务自带的 postgres；填了就连你自己的实例（比如团队共享库）
      VR_PG_HOST: ${VR_PG_HOST:-postgres}
      VR_PG_PORT: ${VR_PG_PORT:-5432}
      VR_PG_DATABASE: ${VR_PG_DATABASE:-thronepath_pg}
      VR_PG_USER: ${VR_PG_USER:-postgres}
      VR_PG_PASSWORD: ${VR_PG_PASSWORD:-postgres}
      JIHENG_PG_SCHEMA: ${JIHENG_PG_SCHEMA:-jiheng}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      SERVICE_TOKEN: ${SERVICE_TOKEN:?set SERVICE_TOKEN}
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_healthy
  python:
    build: ./jiheng-python
    environment:
      JIHENG_REDIS_HOST: redis
      JIHENG_JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      JIHENG_SERVICE_TOKEN: ${SERVICE_TOKEN:?set SERVICE_TOKEN}
      JIHENG_JAVA_INTERNAL_BASE_URL: http://java:8080
      JIHENG_DEEPSEEK_API_KEY: ${JIHENG_DEEPSEEK_API_KEY:?set JIHENG_DEEPSEEK_API_KEY}
      JIHENG_FINANCIAL_MCP_API_KEY: ${JIHENG_FINANCIAL_MCP_API_KEY:?set JIHENG_FINANCIAL_MCP_API_KEY}
    depends_on:
      - java
      - redis
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8088:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - java
      - python

volumes:
  pgdata:
