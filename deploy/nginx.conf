server {
    listen 80;

    location /api/ {
        proxy_pass http://java:8080;
    }

    location /chat/ {
        proxy_pass http://python:8000;
        proxy_buffering off;
        proxy_read_timeout 1800s;
    }

    location /health {
        proxy_pass http://python:8000;
    }

    location /internal/ {
        return 403;
    }
}
