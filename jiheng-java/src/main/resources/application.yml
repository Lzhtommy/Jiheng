server:
  port: 8080

spring:
  application:
    name: jiheng-java
  main:
    banner-mode: off
  jackson:
    date-format: yyyy-MM-dd'T'HH:mm:ss
    time-zone: Asia/Shanghai
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://${VR_PG_HOST:127.0.0.1}:${VR_PG_PORT:5432}/${VR_PG_DATABASE:thronepath_pg}?currentSchema=${JIHENG_PG_SCHEMA:jiheng}
    username: ${VR_PG_USER:postgres}
    password: ${VR_PG_PASSWORD:}
    hikari:
      maximum-pool-size: ${JIHENG_PG_MAX_POOL_SIZE:12}
      minimum-idle: ${JIHENG_PG_MIN_IDLE:2}
      connection-timeout: ${JIHENG_PG_CONNECTION_TIMEOUT_MS:8000}
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-migration-naming: true
    schemas: ${JIHENG_PG_SCHEMA:jiheng}
    default-schema: ${JIHENG_PG_SCHEMA:jiheng}
    create-schemas: true

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    banner: false
    db-config:
      logic-delete-field: deletedAt
      logic-delete-value: 'CURRENT_TIMESTAMP'
      logic-not-delete-value: 'null'
  mapper-locations: classpath:mapper/**/*.xml

jwt:
  secret: ${JWT_SECRET:jiheng-dev-secret-change-me-in-production-at-least-32-chars}
  access-token-expire-days: 7
  refresh-token-expire-days: 30
  issuer: jiheng-ai

security:
  service-token: ${SERVICE_TOKEN:dev-service-token-change-me}
  internal-whitelist:
    - 127.0.0.1
    - ::1

app:
  default-phone: ${JIHENG_DEFAULT_PHONE:15611437032}
  hashids:
    salt: ${HASHIDS_SALT:jiheng-hashids-salt}
    min-length: 8

