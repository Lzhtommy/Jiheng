<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>玑衡 World · 产业链走访</title>
<style>
  :root{color-scheme:dark;--ink:#f7f1e5;--muted:#b8c7c6;--soft:#809393;--gold:#f3c884;--teal:#9dd8d0;--line:rgba(255,240,211,.23);--dark:#09131b;--card:rgba(10,23,30,.88)}
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;font-family:Inter,"Microsoft YaHei","PingFang SC",system-ui,sans-serif;background:var(--dark);color:var(--ink)}
  button,input{font:inherit} button{cursor:pointer} button:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
  .hidden{display:none!important}
  .world{position:relative;height:100dvh;min-height:600px;overflow:hidden;isolation:isolate;background:#101b20}
  .scene-bg{position:absolute;inset:-2%;background-position:center;background-size:cover;transition:transform .75s ease,filter .75s ease;transform:scale(1.04);z-index:-3}
  .scene-bg.crop{background-position:right center;background-size:135% auto}
  .scene-bg.storage{background-position:78% 38%;background-size:160% auto;filter:hue-rotate(22deg) saturate(.75) brightness(.8)}
  .scene-shade{position:absolute;inset:0;z-index:-2;background:linear-gradient(90deg,rgba(3,11,16,.75),rgba(3,11,16,.22) 42%,rgba(4,11,14,.04) 72%),linear-gradient(0deg,rgba(3,11,16,.8),rgba(3,11,16,.10) 58%,rgba(3,11,16,.43));pointer-events:none}
  .world.entering .scene-bg{animation:scene-in .82s cubic-bezier(.15,.68,.28,1) both}
  .world.entering .scene-shade{animation:shade-in .82s ease both}
  @keyframes scene-in{from{opacity:.3;transform:translateX(7%) scale(1.12);filter:blur(6px)}to{opacity:1;transform:translateX(0) scale(1.04);filter:blur(0)}}
  @keyframes shade-in{from{opacity:.1}to{opacity:1}}
  .topbar{position:absolute;z-index:5;left:0;right:0;top:0;display:flex;align-items:center;gap:16px;padding:18px clamp(20px,3.4vw,52px);background:linear-gradient(180deg,rgba(5,14,19,.75),transparent)}
  .app-exit{display:none;flex:none;place-items:center;width:40px;height:40px;border:1px solid var(--line);border-radius:12px;background:rgba(8,23,29,.8);color:var(--ink);font-size:23px;line-height:1}
  body.in-app .app-exit{display:grid}
  .brand{display:flex;align-items:center;gap:11px;font-weight:900;letter-spacing:.08em;white-space:nowrap;font-size:18px;text-shadow:0 2px 15px #000}
  .brand-mark{position:relative;display:block;flex:none;width:42px;height:42px;overflow:hidden;border-radius:50%;border:1px solid rgba(255,211,120,.8);background:#082047;box-shadow:0 0 17px rgba(236,177,75,.28)}
  .brand-mark img{position:absolute;max-width:none;width:147%;height:147%;left:-24%;top:-18%}
  .brand small{display:block;font-size:10px;font-weight:700;letter-spacing:.22em;color:var(--gold);line-height:1.15}
  .case{margin-left:20px;padding-left:20px;border-left:1px solid var(--line);font-size:12px;color:#d9e2df;line-height:1.5}
  .case b{display:block;font-size:13px;color:#fff;letter-spacing:.05em}
  .spacer{flex:1}
  .top-note{padding:7px 11px;background:rgba(8,24,29,.56);border:1px solid var(--line);border-radius:999px;color:#f1dbc0;font-size:11px;white-space:nowrap;backdrop-filter:blur(8px)}
  .top-action{border:1px solid var(--line);background:rgba(8,23,29,.65);color:var(--ink);border-radius:12px;padding:8px 13px;font-size:12px;font-weight:800;backdrop-filter:blur(10px)}
  .top-action:hover,.tool:hover{background:rgba(22,52,57,.9);border-color:var(--gold)}
  .scene-copy{position:absolute;left:clamp(24px,5vw,82px);top:clamp(105px,14vh,170px);max-width:min(520px,52vw);text-shadow:0 3px 22px rgba(0,0,0,.75);pointer-events:none}
  .eyebrow{color:var(--gold);font-size:12px;font-weight:850;letter-spacing:.22em;text-transform:uppercase}
  .scene-copy h1{font-family:"Songti SC","Noto Serif CJK SC",serif;font-size:clamp(36px,5.5vw,76px);line-height:1.1;margin:12px 0 13px;letter-spacing:.03em}
  .scene-copy p{margin:0;max-width:440px;color:#e5e9e4;font-size:clamp(13px,1.15vw,16px);line-height:1.75}
  .ambient-line{display:inline-flex;gap:7px;align-items:center;color:#c8d7d2;margin-top:22px;font-size:11px;letter-spacing:.1em}
  .ambient-line:before{content:"";display:block;width:26px;border-top:1px solid var(--gold)}
  .npc-portrait{position:absolute;right:7vw;bottom:19vh;height:75vh;max-height:850px;width:min(42vw,600px);object-fit:contain;object-position:bottom center;mix-blend-mode:screen;filter:drop-shadow(0 20px 40px rgba(0,0,0,.75));mask-image:linear-gradient(90deg,transparent 0%,#000 18%,#000 82%,transparent 100%);pointer-events:none}
  .npc-presence{position:absolute;right:clamp(35px,7vw,110px);top:24vh;width:210px;padding:12px 16px;border:1px solid rgba(255,230,185,.45);border-radius:13px;background:rgba(5,17,23,.55);box-shadow:0 18px 40px #0005;backdrop-filter:blur(9px);text-align:center}
  .npc-presence .pulse{height:9px;width:9px;margin:0 auto 10px;background:var(--teal);border-radius:50%;box-shadow:0 0 0 7px rgba(157,216,208,.15),0 0 24px var(--teal)}
  .npc-presence b{display:block;font-size:18px;letter-spacing:.12em}.npc-presence span{font-size:11px;color:var(--muted)}
  .scene-hotspots{position:absolute;z-index:4;left:clamp(24px,5vw,82px);top:39%;display:flex;flex-direction:column;align-items:flex-start;gap:9px}
  .inspect-pin{min-height:42px;border:1px solid rgba(247,221,180,.65);border-radius:12px;padding:8px 12px;background:rgba(8,24,30,.78);color:#fff5df;box-shadow:0 10px 30px #0008;backdrop-filter:blur(9px);font-size:12px;font-weight:750;text-align:left}
  .inspect-pin:before{content:"✦";margin-right:7px;color:var(--gold)}.inspect-pin.done{border-color:rgba(157,216,208,.65);color:var(--teal)}.inspect-pin.done:before{content:"✓";color:var(--teal)}
  .inspect-pin:hover{background:rgba(27,60,62,.93);transform:translateX(3px)}
  .cell-progress{position:absolute;z-index:4;left:clamp(24px,5vw,82px);top:calc(39% - 52px);border:1px solid rgba(243,200,132,.7);border-radius:11px;background:rgba(8,24,30,.82);color:#ffe2ae;padding:9px 13px;font-size:12px;font-weight:800;box-shadow:0 10px 25px #0008}
  .cell-helper{position:absolute;z-index:4;right:clamp(24px,5vw,82px);top:30%;display:flex;align-items:center;gap:8px;border:1px solid #88c9fc;border-radius:14px;background:rgba(10,30,58,.86);color:#e1f3ff;padding:7px 11px;box-shadow:0 12px 30px #0009;font-size:11px;font-weight:800}
  .cell-helper-face{position:relative;display:grid;place-items:center;width:28px;height:24px;border:2px solid #9cdcff;border-radius:8px;background:#2765b2;color:#d6f6ff;font-size:14px;line-height:1;box-shadow:0 0 0 3px rgba(87,158,245,.2)}
  .cell-helper-face:before{content:"";position:absolute;left:11px;top:-7px;width:2px;height:5px;background:#9cdcff}
  .scene-hotspots.cell-hotspots{inset:0;left:0;right:0;top:0;display:block;pointer-events:none}
  .cell-hotspot{position:absolute;left:var(--x);top:var(--y);transform:translate(-50%,-50%);display:grid;place-items:center;width:62px;height:62px;border:0;border-radius:50%;background:transparent;color:#ffe7b6;pointer-events:auto;touch-action:manipulation}
  .cell-hotspot:before{content:"";position:absolute;width:20px;height:20px;border:1px solid rgba(255,225,160,.9);border-radius:50%;background:rgba(255,222,145,.2);box-shadow:0 0 14px #f6c975aa;animation:hotspot-pulse 2.5s ease-in-out infinite}
  .cell-hotspot:after{content:"✦";position:relative;font-size:12px;text-shadow:0 0 9px #ffd477;animation:hotspot-glint 3.2s ease-in-out infinite}
  .cell-hotspot.visited:before{border-color:#8de2c8;background:rgba(89,199,166,.34);box-shadow:0 0 16px #6dd3b8aa;animation:none}
  .cell-hotspot.visited:after{content:"✓";color:#d7fff1;font-size:14px;animation:none}
  .cell-hotspot.inspecting:before{width:35px;height:35px;border-color:#fff4c9;background:rgba(255,218,135,.45);box-shadow:0 0 30px #ffd477;animation:none}
  .cell-hotspot .hotspot-label{position:absolute;left:50%;top:calc(100% + 1px);transform:translateX(-50%);display:none;padding:5px 9px;border:1px solid rgba(255,231,182,.5);border-radius:99px;background:rgba(7,20,27,.88);color:#fff5df;font-size:10px;white-space:nowrap;box-shadow:0 6px 18px #0008}
  .cell-hotspot:hover .hotspot-label,.cell-hotspot:focus-visible .hotspot-label{display:block}
  @keyframes hotspot-pulse{50%{transform:scale(1.24);opacity:.62}}
  @keyframes hotspot-glint{50%{opacity:.55;transform:scale(.85) rotate(35deg)}}
  .world.cell-world .dialogue{height:clamp(165px,22dvh,215px);bottom:18px}
  .world.cell-world .dialogue-main{display:block;padding:7px 22px 2px}
  .world.cell-world .speaker-side{display:none}
  .world.cell-world .speech-area .npc-line{font-size:clamp(16px,1.65vw,21px);line-height:1.45;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;overflow:auto}
  .world.cell-world .prompt-row{min-height:39px;padding:2px 22px 6px;}
  .world.cell-world .input-row{display:none}
  .world.cell-world.chat-open .dialogue{height:min(430px,56dvh)}
  .world.cell-world.chat-open .input-row{display:flex}
  .cell-widget{margin:15px 0;padding:15px;border:1px solid #b9a574;border-radius:10px;background:rgba(255,255,255,.22)}
  .cell-widget-title{display:flex;align-items:center;justify-content:space-between;gap:10px;color:#526257;font-size:12px;font-weight:850}
  .cell-widget-note{color:#6d725f;font-size:11px;line-height:1.6}
  .timeline-chart{display:block;width:100%;height:145px;margin:8px 0 1px;overflow:visible}
  .timeline-chart .grid{stroke:#8b927b;stroke-opacity:.35;stroke-width:1}.timeline-chart .trend{fill:none;stroke:#498c77;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}.timeline-chart .timelineDot{fill:#e9a64c;stroke:#fff3d0;stroke-width:3;transition:cx .12s,cy .12s}
  .timeline-slider{width:100%;accent-color:#4d8c72;touch-action:pan-y}.timeline-years{display:flex;justify-content:space-between;color:#677166;font-size:10px}
  .timeline-readout{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:5px;padding:8px 10px;border-radius:7px;background:#ece0bd;color:#4b5549;font-size:11px}.timeline-readout strong{font-size:16px;color:#366c57}
  .mini-action{min-height:42px;border:1px solid #7b683f;border-radius:8px;background:#ead8ad;color:#3b2b19;padding:9px 13px;font-size:12px;font-weight:850}.mini-action:disabled{opacity:.5;cursor:not-allowed}
  .factory-meter{height:13px;margin:10px 0 5px;border-radius:99px;background:#d1c4a0;overflow:hidden}.factory-meter span{display:block;width:48%;height:100%;border-radius:inherit;background:linear-gradient(90deg,#c99951,#4c9978);transition:width .5s}.factory-meter.upgraded span{width:92%}
  .factory-stats{display:flex;justify-content:space-between;gap:8px;color:#566255;font-size:12px}.factory-stats strong{color:#355f4d}
  .interaction-row{display:grid;grid-template-columns:minmax(120px,.8fr) minmax(180px,1.2fr);gap:12px;align-items:center;margin-top:14px}
  .drag-card{min-height:64px;border:1px solid #a99467;border-radius:9px;background:#fff0ce;color:#344139;padding:10px 12px;text-align:center;touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab}
  .drag-card:active{cursor:grabbing}.drag-card.dragging{opacity:.72;z-index:100;pointer-events:none;box-shadow:0 15px 35px #0004}
  .drop-zone{min-height:86px;display:grid;place-items:center;border:2px dashed #9d895f;border-radius:10px;background:rgba(255,255,255,.18);padding:12px;color:#667060;text-align:center;font-size:12px;line-height:1.6;transition:.15s}
  .drop-zone.ready{border-color:#4e9c7c;background:#e2f0ce;color:#315e4b}
  .market-feed{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:15px 0}
  .market-feed article{border:1px solid #b8a87f;border-radius:9px;background:rgba(255,255,255,.24);padding:12px 8px;text-align:center;color:#4e5b50}
  .market-feed b{display:block;font-size:20px;color:#3f8667}.market-feed article:last-child b{color:#b46f50}.market-feed span{font-size:10px;line-height:1.4}
  .market-options{display:grid;gap:8px}.market-options button{min-height:44px;border:1px solid #ac946a;border-radius:8px;padding:9px 12px;background:#f7e9cb;color:#334039;text-align:left;font-size:12px;line-height:1.5}.market-options button:hover{background:#fff3d8}
  .industry-card{border-left-color:#54836d;background:linear-gradient(120deg,#fff0ca,#e6ebce)}.industry-card strong{font-size:20px}.industry-card .card-label{display:inline-block;margin:6px 0 0;color:#4e8068;font-weight:900;font-size:10px;letter-spacing:.12em}
  .analysis-card-list{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:15px 0}
  .analysis-card-list .drag-card{min-height:76px;font-size:12px}.analysis-board{position:relative;min-height:150px;display:grid;grid-template-columns:1fr auto 1fr;grid-template-rows:1fr 1fr;align-items:center;justify-items:center;gap:6px;border:1px solid #b4a476;border-radius:12px;background:radial-gradient(circle at center,#fff2cf,#e5d5ad);padding:14px}
  .analysis-board:before{content:"";position:absolute;left:20%;right:20%;top:50%;border-top:1px dashed #a98d55}.analysis-target{grid-column:2;grid-row:1/3;z-index:1;display:grid;place-items:center;width:126px;min-height:78px;border:2px solid #997947;border-radius:12px;background:#f7e8c2;color:#355d4b;text-align:center;font:17px "Songti SC",serif;padding:8px}
  .analysis-slot{z-index:1;max-width:115px;min-width:80px;min-height:36px;border:1px dashed #a99768;border-radius:8px;background:#f7edda;color:#6b6c5e;padding:7px;text-align:center;font-size:10px}
  .analysis-slot.connected{border-style:solid;border-color:#588d73;background:#e2efd7;color:#3a6951;font-weight:850}
  .analysis-equation{margin-top:11px;color:#536254;text-align:center;font-size:12px}.analysis-equation b{color:#527e63}
  .cell-insight{border:1px solid #b69457;border-radius:11px;padding:20px;background:radial-gradient(circle at 88% 15%,#fff6cf,#e6d5aa);text-align:center}
  .cell-insight .stamp{font-size:11px;letter-spacing:.27em;color:#725120;font-weight:900}.cell-insight strong{display:block;margin:8px 0;font:clamp(22px,4vw,32px) "Songti SC",serif;color:#345c4d}
  .cell-insight p{margin:8px 0}.cell-insight .equation{color:#4c735e;font-size:14px;font-weight:850;line-height:1.9}
  .analysis-button{display:block;margin:12px auto 0;min-height:42px;border:1px solid #6e795e;border-radius:8px;background:#516f5b;color:#fff6df;padding:9px 16px;font-weight:850}.analysis-button:disabled{opacity:.45;cursor:not-allowed}
  .toolbelt{position:absolute;z-index:7;left:clamp(15px,3vw,42px);bottom:calc(min(350px,45dvh) + 32px);display:flex;gap:9px}
  .tool{min-width:70px;border:1px solid rgba(246,224,183,.4);border-radius:14px;background:rgba(8,23,29,.73);color:var(--ink);padding:7px 11px;text-align:center;box-shadow:0 12px 25px #0006;backdrop-filter:blur(12px)}
  .tool .ico{display:block;font-size:21px;line-height:1.15}.tool span:last-child{display:block;font-size:10px;font-weight:700;letter-spacing:.13em}
  .tool .count{position:absolute;margin:-42px 0 0 51px;background:#c7844b;color:#160f0a;border-radius:50%;font-size:9px;line-height:17px;width:17px;height:17px}
  .dialogue{position:absolute;z-index:6;left:clamp(15px,3vw,42px);right:clamp(15px,3vw,42px);bottom:18px;height:min(350px,45dvh);border:1px solid rgba(247,221,180,.45);border-radius:20px 20px 13px 13px;background:linear-gradient(120deg,rgba(8,25,32,.95),rgba(11,27,34,.9));box-shadow:0 22px 70px rgba(0,0,0,.58),inset 0 1px 0 rgba(255,255,255,.12);backdrop-filter:blur(20px);display:flex;flex-direction:column;overflow:hidden}
  .dialogue:before{content:"";position:absolute;left:26px;right:26px;top:0;border-top:2px solid rgba(243,200,132,.54)}
  .dialogue-head{display:flex;align-items:center;gap:12px;padding:13px 22px 8px;min-height:60px;border-bottom:1px solid rgba(255,255,255,.09)}
  .speaker-icon{height:37px;width:37px;border:1px solid var(--gold);border-radius:12px;display:grid;place-items:center;color:var(--gold);font-family:serif;font-size:21px;background:rgba(243,200,132,.1)}
  .speaker b{display:block;font-size:15px;letter-spacing:.06em}.speaker small{display:block;font-size:10px;letter-spacing:.09em;color:var(--muted)}
  .mood{margin-left:auto;color:var(--teal);font-size:11px;white-space:nowrap}.mood:before{content:"●";padding-right:6px;font-size:8px}
  .head-btn{border:0;background:transparent;color:var(--muted);font-size:11px;text-decoration:underline;text-underline-offset:4px;padding:6px}
  .dialogue-main{display:grid;grid-template-columns:160px 1fr;gap:18px;min-height:0;flex:1;padding:14px 22px 5px}
  .speaker-side{font-size:11px;line-height:1.7;color:var(--muted);padding:4px 12px 0 0;border-right:1px solid var(--line)}
  .speaker-side b{display:block;color:var(--gold);font-size:10px;letter-spacing:.16em;margin-bottom:8px}
  .speech-area{overflow:auto;scrollbar-width:thin;display:flex;flex-direction:column;gap:7px;padding-right:8px}
  .speech-area .said-by-you{font-size:11px;color:var(--teal);letter-spacing:.03em}
  .speech-area .npc-line{font-family:"Songti SC","Noto Serif CJK SC",serif;font-size:clamp(18px,2vw,26px);line-height:1.55;color:#fffaf0;letter-spacing:.018em;animation:line-in .32s ease both}
  @keyframes line-in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .speech-area .travel-hint{display:inline-flex;align-items:center;gap:7px;width:max-content;margin-top:2px;color:var(--gold);font-size:11px;font-family:Inter,"Microsoft YaHei",sans-serif}
  .prompt-row{display:flex;align-items:center;gap:7px;overflow-x:auto;padding:4px 22px 9px 200px;scrollbar-width:none;min-height:46px}.prompt-row::-webkit-scrollbar{display:none}
  .prompt{flex:none;border:1px solid rgba(157,216,208,.35);border-radius:100px;background:rgba(157,216,208,.08);color:#e1f5ef;font-size:12px;padding:6px 11px;white-space:nowrap;transition:.15s}
  .prompt:hover{border-color:var(--teal);transform:translateY(-2px);background:rgba(157,216,208,.17)}
  .input-row{display:flex;align-items:center;gap:9px;margin:0 22px 15px 200px;padding:5px;border:1px solid rgba(255,255,255,.23);border-radius:10px;background:rgba(1,10,16,.47)}
  .input-row:focus-within{border-color:var(--gold)}
  .input-row input{min-width:0;flex:1;border:0;outline:0;background:transparent;color:#fff;padding:7px 8px;font-size:13px}
  .input-row input::placeholder{color:#98aaa9}
  .send{border:0;border-radius:7px;background:var(--gold);color:#23190e;font-weight:850;padding:8px 13px;white-space:nowrap;font-size:12px}
  .send:hover{filter:brightness(1.12)}.send:disabled{opacity:.45;cursor:wait}
  .travel{position:absolute;z-index:7;right:clamp(20px,4vw,55px);bottom:calc(min(350px,45dvh) + 39px);padding:10px 15px;border:1px solid var(--gold);border-radius:10px;background:linear-gradient(110deg,#f4cd8f,#daaa64);color:#24160b;font-size:12px;font-weight:900;box-shadow:0 12px 35px #0008}
  .travel:hover{transform:translateY(-2px);filter:brightness(1.06)}
  .toast{position:absolute;z-index:15;top:85px;left:50%;transform:translateX(-50%);border:1px solid #f4d49c;border-radius:9px;padding:9px 15px;background:#15282b;color:#fbe4bd;box-shadow:0 15px 40px #0008;font-size:12px;max-width:90vw;text-align:center}
  .cover{position:absolute;z-index:20;inset:0;background:rgba(4,11,17,.72);backdrop-filter:blur(12px);display:grid;place-items:center;padding:18px;overflow:auto}
  .sheet{position:relative;width:min(820px,100%);max-height:min(89dvh,860px);overflow:auto;background:#e9d9b6;color:#28322d;border:1px solid #c3a975;border-radius:13px;box-shadow:0 26px 80px #000b,0 0 0 7px rgba(238,216,173,.08);padding:clamp(22px,4vw,46px)}
  .sheet:before{content:"";position:absolute;inset:9px;border:1px solid #baa474;border-radius:6px;pointer-events:none}
  .sheet h2{margin:5px 0 7px;font-family:"Songti SC",serif;font-size:clamp(27px,4vw,42px)}
  .sheet p{line-height:1.75;margin:0 0 22px;color:#4d5b52;font-size:13px}
  .sheet-kicker{padding-right:42px;font-weight:850;letter-spacing:.21em;color:#8c6531;font-size:11px}
  .close{position:absolute;right:22px;top:18px;z-index:2;border:1px solid #aa9873;border-radius:8px;background:rgba(255,255,255,.2);color:#3b4037;font-size:19px;width:32px;height:32px;line-height:1}
  .route{display:flex;gap:9px;align-items:stretch;margin:25px 0 10px}

  {
    id:"salt", place:"盐湖矿区", region:"01 / 上游资源", npc:"岚", role:"盐湖现货负责人",
    bg:"assets/salt-lake-mine-v1.png", crop:true, atmosphere:"风从盐田吹过，报价牌在你身旁亮着。",
    arrival:"你刚到矿区，岚已经在等。你不是来听行情故事的：半年后的电芯能不能按时交，得从这里开始问。",
    opening:"你就是栖岸储能的采购负责人？今天矿区的现货不等人。你是想先定量，还是先跟我谈价格？",
    generic:"岚敲了敲报价牌：我能谈供货，也能谈价格基准。你得告诉我，你最担心哪一件。",
    topics:[
      {id:"claim",label:"问涨价",prompt:"听说一周涨了三成，这个价怎么来的？",keys:["涨价","涨幅","三成","30%","价格","现货","行情"],reply:"岚看了一眼牌子：上面只有一根往上的线。三成是市场上在传的说法，我现在能报今天的价；你若要锁半年，我得先知道你要锁多少量。",repeat:"我说的是现货气氛，不是一份带日期和指数的报告。你要可核对的报价，就得把基准写出来。",scroll:{id:"salt-rumor",title:"矿区的涨价说法",body:"岚口头提到“涨了三成”，现场看板没有指数名称和日期。",kind:"口头说法"}},
      {id:"proof",label:"问价格依据",prompt:"交货日价格按哪个指数和日期算？",keys:["依据","指数","日期","合同","样张","凭证","基准","条款"],reply:"他把一张合同样张推到你面前：只写着“以交货日行情为准”，没写指数、取价日，也没有上限。岚抬眼看你：你要补哪一条？",repeat:"那张样张仍在桌上。指数、取价日和上限，现在一个都没写。",scroll:{id:"salt-contract",title:"现货合同样张",body:"本局模拟样张仅写“价格以交货日行情为准”，未指定指数、取价日或上限。",kind:"剧情单据"}},
      {id:"risk",label:"问交货风险",prompt:"如果我现在锁量，交期能保证吗？",keys:["交期","交货","供货","保供","锁量","数量","货源"],reply:"岚收起笑：数量可以排，价格却要按交货日算。我现在答应你有货，不等于答应你半年后的成本不变。你们能承受多大的波动？",repeat:"供货量和价格边界是两件事。你要我承诺，就把这两件事分开写。"}
    ],
    offerPrompt:"我愿意报采购量，但基准价和季度复核要写清楚。",
    early:"岚把笔放下：我们才说了两句。你还没问清怎么算价，怎么知道自己开的条件值不值？",
    offerStrong:"岚把样张上的“随行就市”圈了起来：行，数量先报；指数、取价日和季度复核写成待确认条款。今天我给你的只是口头条件，正式合同还得双方核对。",
    offerWeak:"岚点头：数量可以先排，我按今天的现货报价给你留位置。至于交货时的价格，我们还没划清上限。",
    termsStrong:"先报量；价格指数、取价日和季度复核写入待确认条款。",
    termsWeak:"先排供货量；交货日价格仍未设上限。",
    risk:"涨价幅度和合同基准尚未从外部来源核实。",
    lead:"岚朝山下的厂房指了指：矿盐往下走，先到材料工坊。那位坊主岑比我更会算成本。你把这张样张带去，他就没法只说“都涨了”。",
    next:"材料工坊", cross:{}
  },
  {
    id:"materials", place:"材料工坊", region:"02 / 中游材料", npc:"岑", role:"正极材料坊主",
    bg:"assets/materials-workshop-v1.png", portrait:"assets/cen-workshop-owner-v1.png", atmosphere:"机器还热着，岑把账本按在工作台上。",
    arrival:"矿区的口头报价到了这里，已经变成材料供应商递来的涨价函。工坊主岑看着你手里的地图。",
    opening:"你从盐湖来？那你应该知道原料有多紧。我这批材料要稳定交付，价格就得跟着涨。你今天能给我什么承诺？",
    generic:"岑用指节敲了敲账本：我有库存、有长协，也有排产。你问哪个，我就从哪个跟你谈。",
    topics:[
      {id:"claim",label:"问成本",prompt:"你说必须涨价，库存和成本发生了什么？",keys:["成本","库存","涨价","材料","报价","用完","批次"],reply:"岑掀开台账的一角：我说库存紧，并不等于所有旧批次都用完。旧料、现货料混在一起，成本得按批次看。你要锁量，我得知道你能不能稳定下单。",repeat:"库存是分批次的。我可以解释成本，但不能把一句“都涨了”当明细给你。",scroll:{id:"materials-stock",title:"材料批次台账摘记",body:"本局模拟台账显示旧批次与现货批次同时存在；完整数量和进货成本尚未出示。",kind:"剧情单据"}},
      {id:"proof",label:"问长协条款",prompt:"你和上游的长协是按天调价，还是按季度？",keys:["长协","合同","季度","调价","条款","台账","凭证","进货价"],reply:"岑停了一秒，把复印件翻到背面：调价周期写的是季度。我刚才说得太快了。要谈全额传导，先把各批次进货价摆出来。",repeat:"复印件上的调价周期是季度。至于每一批成本，还要看完整台账。",scroll:{id:"materials-contract",title:"材料长协复印件",body:"本局模拟复印件写着“按季度调价”；库存批次与进货价尚未出示。",kind:"剧情单据"}},
      {id:"risk",label:"问排产",prompt:"如果不接受全额涨价，这批材料会不会断供？",keys:["交期","断供","供货","排产","稳定","产能","交付"],reply:"岑看向机器：排产可以先留位置，但不能无限留。你若能给一个滚动的采购计划，我就能把交付风险和价格谈判分开。",repeat:"先给滚动计划，我才能谈排产。价格和交付可以分别约束。",scroll:{id:"materials-schedule",title:"工坊排产白板",body:"本局模拟白板只写“可讨论分批窗口”；没有无条件保交期承诺。",kind:"剧情单据"}}
    ],
    offerPrompt:"先按季度复核，库存批次和成本凭证补齐后再谈涨幅。",
    early:"岑摇头：你连我的长协怎么调价都没问，就要我先按你的条件签？再谈谈。",
    offerStrong:"岑把报价函往回抽了一寸：可以，先按季度复核。库存批次和进货价我补给你，幅度等你看完再议。今天只能算口头框架。",

function classify(scene,text){

  if(scene.id==="materials"){
    if(/长协|季度|调价条款|复印件|合同/.test(text)) return "proof";
    if(/排产|交期|断供|供货|机台|窗口/.test(text)) return "risk";
    if(/库存|批次|台账|旧料|进货成本|现货料/.test(text)) return "claim";
  }
  if(/依据|凭证|指数|日期|合同|条款|台账|长协|规则|名单|回款|账期/.test(text)) return "proof";

  app.innerHTML='<section class="epilogue"><button class="app-exit epilogue-exit" data-act="exit-app" aria-label="返回玑衡 App">←</button><div class="epilogue-card">'+
    '<div class="eyebrow">采购走访结束 · 情景推演</div><h1>你把地图走成了一份谈判记录</h1>'+
    '<p>从盐湖到客户，再到第二条需求线，你听到了不同环节想承担与想转嫁的风险。下一步不是选一个标准答案，而是核对原始合同、报价明细、交付计划和分部回款来源。</p>'+
    (impact?'<div class="epilogue-row"><b>你的材料谈判影响了下一站</b><span>'+esc(impact)+'</span></div>':"")+
    rows+'<p>本局人物、合同和数字均为虚构场景；口头回应不是正式合同。你在背包里收集了 '+S.scrolls.length+' 份剧情卷轴。</p>'+
    '<div class="epilogue-actions"><button class="epilogue-action" data-act="back-scene">回到最后一站</button>'+
    '<button class="epilogue-action" data-act="open-map">展开走访地图</button>'+
    '<button class="epilogue-action" data-act="reset">重新走访</button></div></div></section>'+
    (overlay?renderOverlay():"");
}
function renderOverlay(){
  if(overlay==="map") return renderMap();
  if(overlay==="bag") return renderBag();
  if(overlay==="history") return renderHistory();
  if(overlay==="material-offer" && currentScene().id==="materials") return renderMaterialOffer();
  if(overlay==="material-guide" && currentScene().id==="materials") return renderMaterialGuide();
  if(currentScene().id==="cell"){
    if(overlay==="cell-mission") return renderCellMission();
    if(overlay && overlay.startsWith("cell-interaction:")) return renderCellInteraction(overlay.slice(17));
    if(overlay && overlay.startsWith("cell-card:")) return renderCellCard(overlay.slice(10));
    if(overlay==="cell-factory-result") return renderFactoryResult();
    if(overlay==="cell-analysis") return renderCellAnalysis();
    if(overlay==="cell-insight") return renderCellInsight();
    if(overlay==="cell-complete") return renderCellComplete();
    if(overlay==="cell-hint") return renderCellHint();
  }
  return "";
}
function renderScene(){
  const scene=currentScene(),p=progress(scene);
  const lastNpc=p.history.filter(x=>x.speaker==="npc").slice(-1)[0]||{text:scene.opening};
  const lastYou=p.history.filter(x=>x.speaker==="you").slice(-1)[0];
  const reveal=S.current<SCENES.length-1?S.unlocked>S.current:S.finished;
  const nextLabel=S.current<SCENES.length-1?"翻地图 · 前往"+SCENES[S.current+1].place:"结束走访 · 回办公室";
  const mood=p.deal?"已经谈过条件":(seenCount(p)>=2?"开始认真谈":"正在观察你");
  const prompts=topicPrompts(scene,p).map(function(x){
    return '<button class="prompt" data-act="'+esc(x.action||"prompt")+'" data-intent="'+esc(x.intent||"")+'" data-text="'+esc(x.text||"")+'">'+esc(x.label)+'</button>';
  }).join("");
  const hotspots=scene.id==="materials"?'<nav class="scene-hotspots" aria-label="可查看的工坊现场">'+Object.entries(MATERIAL_CLUES).map(function([id,clue]){
    return '<button class="inspect-pin '+(p.seen.includes(clue.topic)?"done":"")+'" data-act="inspect-material" data-clue="'+id+'" aria-label="查看'+esc(clue.label)+'">'+esc(clue.label)+'</button>';
  }).join("")+'</nav>':scene.id==="cell"?'<nav class="scene-hotspots cell-hotspots" aria-label="场景中的可调查线索">'+Object.entries(CELL_STATIONS).map(function([id,station],index){
    const point=window.matchMedia("(max-width:760px)").matches?station.mobile:station.desktop;
    const side=["左侧","中央","右侧"][index];
    return '<button class="cell-hotspot '+(p.cellMission.interactions[id]?"visited":"")+'" style="--x:'+point.x+'%;--y:'+point.y+'%" data-act="cell-inspect" data-station="'+id+'" aria-label="调查'+side+'场景物件" title="场景线索"><span class="hotspot-label">'+(p.cellMission.interactions[id]?"已调查":"调查")+'</span></button>';
  }).join("")+'</nav>':"";
  const cellTools=scene.id==="cell"?'<button class="cell-progress" data-act="open-cell-mission" aria-label="查看随身委托">📜 '+(p.cellMission.completed?"委托已完成":cellCount(p)?"线索已收入":"随身委托")+'</button>'+
    '<button class="cell-helper" data-act="open-cell-hint" aria-label="询问小玑提示"><span class="cell-helper-face" aria-hidden="true">◕</span><span>小玑</span></button>':"";
  const signals=scene.id==="cell"?Object.entries(CELL_STATIONS).filter(function([id]){return cellCardOwned(p,id);}).map(function([id,station]){
    const mobile=window.matchMedia("(max-width:760px)").matches;
    const point=mobile?station.mobile:station.desktop;
    const signalY=id==="warehouse"?point.y-11:point.y+8;
    return '<span class="cg-signal-badge" style="--x:'+(mobile && id==="warehouse"?18:point.x)+'%;--y:'+Math.min(signalY,75)+'%" data-cg-signal="'+id+'">'+({warehouse:"MATERIAL COST ↓",factory:"EFFICIENCY ↑",market:"DEMAND ↑"}[id])+'</span>';
  }).join(""):"";
  const unlockedRoute=scene.id==="cell" && p.cellMission.completed && SCENES[S.current+1]?'<div class="cg-route-ready" aria-label="下一产业区域已解锁"><span>03 · 电芯城 ✓</span><i aria-hidden="true"></i><span class="cg-next">04 · '+esc(SCENES[S.current+1].place)+' 🔓</span></div>':"";
  app.innerHTML='<section class="world '+(scene.id==="cell"?'cell-world '+(cellChatOpen?'chat-open':''):'')+'" id="world">'+
    '<div class="scene-bg '+esc(scene.id)+' '+(scene.crop?"crop ":"")+(scene.storage?"storage":"")+'" style="background-image:url(&quot;'+esc(scene.bg)+'&quot;)"></div>'+
    '<div class="scene-shade"></div>'+
    '<header class="topbar"><button class="app-exit" data-act="exit-app" aria-label="返回玑衡 App">←</button><div class="brand"><span class="brand-mark"><img src="assets/jiheng-world-logo.png" alt="" aria-hidden="true"></span><span>玑衡 <small>WORLD · 走访</small></span></div>'+
    '<div class="case"><b>栖岸储能 · 半年采购方案</b><span>你是采购负责人，正沿产业链找人谈条件</span></div>'+
    '<div class="spacer"></div><span class="top-note">情景模拟 · 人物与条款为虚构</span>'+
    '<button class="world-back" data-act="back-world" aria-label="返回 World 首页"><span class="wb-arrow">←</span>World</button>'+
    '<button class="top-action" data-act="open-map">地图 '+(S.current+1)+' / '+SCENES.length+'</button></header>'+
    '<div class="scene-copy"><div class="eyebrow">'+esc(scene.region)+'</div><h1>'+esc(scene.place)+'</h1>'+
    '<p>'+esc(arrivalLine(scene))+'</p><div class="ambient-line">'+esc(scene.atmosphere)+'</div></div>'+
    (scene.portrait?'<img class="npc-portrait" src="'+esc(scene.portrait)+'" alt="'+esc(scene.npc)+'的角色立绘">':"")+
    hotspots+cellTools+signals+unlockedRoute+
    '<nav class="toolbelt" aria-label="走访工具"><button class="tool" data-act="open-map" aria-label="展开地图"><span class="ico">▤</span><span>地图</span></button>'+
    '<button class="tool" data-act="open-bag" aria-label="打开卷轴背包"><span class="ico">▣</span><span>背包</span>'+(S.scrolls.length+(scene.id==="cell"?1:0)?'<span class="count">'+(S.scrolls.length+(scene.id==="cell"?1:0))+'</span>':"")+'</button></nav>'+
    (reveal && scene.id!=="cell"?'<button class="travel" data-act="travel">'+esc(nextLabel)+' →</button>':"")+
    '<section class="dialogue" aria-label="与'+esc(scene.npc)+'交谈"><div class="dialogue-head">'+
    '<span class="speaker-icon">'+esc(scene.npc.slice(0,1))+'</span><div class="speaker"><b>'+esc(scene.npc)+'</b>'+
    '<small id="npcMode">'+esc(scene.role)+' · 预设剧情对话</small></div><span class="mood">'+esc(mood)+'</span>'+
    '<button class="head-btn" data-act="'+(scene.id==="cell"?"toggle-cell-chat":"open-history")+'">'+(scene.id==="cell"?(cellChatOpen?"收起对话":"和墨聊聊"):"回看对话")+'</button></div>'+
    '<div class="dialogue-main"><div class="speaker-side"><b>此行目的</b>'+(scene.id==="cell"?"听听墨的发现，自己走进现场找线索。":"为栖岸储能谈半年采购。听他说，也告诉他你的条件。")+'<br><br>你可以打字、追问，或出示背包里的卷轴。</div>'+
    '<div class="speech-area" aria-live="polite">'+(lastYou?'<div class="said-by-you">你刚才说：'+esc(lastYou.text)+'</div>':"")+
    '<div class="npc-line">'+esc(busy?"（"+scene.npc+"正在想你提出的条件……）":lastNpc.text)+'</div>'+
    (reveal?'<div class="travel-hint">地图上亮起了下一段路 →</div>':"")+'</div></div>'+
    '<div class="prompt-row">'+prompts+(scene.id==="cell"?"":'<button class="prompt" data-act="open-bag">出示卷轴</button>')+'</div>'+
    '<form class="input-row" id="speakForm"><input id="playerInput" maxlength="240" autocomplete="off" aria-label="对'+esc(scene.npc)+'说话" placeholder="'+(scene.id==="cell"?"直接问墨：为什么产线更忙，报价反而更低？":"直接对"+esc(scene.npc)+"说话，例如：这个价格依据是什么？")+'" '+(busy?"disabled":"")+'>'+
    '<button class="send" type="submit" '+(busy?"disabled":"")+'>'+ (busy?"回应中":"发送 ↗")+'</button></form></section>'+
    (toastText?'<div class="toast" id="toast" role="status">'+esc(toastText)+'</div>':"")+
    (overlay?renderOverlay():"")+'</section>';
  const playerInput=document.getElementById("playerInput");
  const world=document.getElementById("world");
  if(playerInput && world){
    playerInput.addEventListener("focus",function(){world.classList.add("input-focused");});
    playerInput.addEventListener("blur",function(){world.classList.remove("input-focused");});
    if(document.activeElement===playerInput) world.classList.add("input-focused");
  }
}
function render(){ if(S.report) renderReport(); else renderScene(); }
function transitionTo(index){
  if(transitioning || busy || index<0 || index>S.unlocked || index>=SCENES.length) return;
  overlay=null;
  if(index===S.current){render();return;}
  toastText="";
  clearTimeout(toastTimer);
  transitioning=true;
  const target=SCENES[index];
  const firstCellVisit=target.id==="cell" && !S.scenes.cell;
  app.insertAdjacentHTML("beforeend",'<div class="wipe" aria-live="polite"><div class="wipe-card"><small>展开手中的地图 · '+esc(target.region)+'</small><strong>'+esc(target.place)+'</strong><span>下一段产业链正在你面前展开</span></div></div>');
  setTimeout(function(){
    S.current=index;
    progress(target);
    saveState();
    transitioning=false;
    if(firstCellVisit){overlay=null;cellChatOpen=false;}
    render();
    const world=document.getElementById("world");
    if(world){world.classList.add("entering");setTimeout(function(){world.classList.remove("entering");},1000);if(target.id==="cell" && window.JHWorldFX) window.JHWorldFX.revealScene(world);}
  },850);
}
function finishJourney(){
  if(!S.finished || busy || transitioning) return;
  transitioning=true;
  app.insertAdjacentHTML("beforeend",'<div class="wipe"><div class="wipe-card"><small>走访结束 · 返回办公室</small><strong>摊开你的卷轴</strong><span>写下每一站口头谈成的条件</span></div></div>');
  setTimeout(function(){S.report=true;saveState();transitioning=false;overlay=null;render();},850);
}
app.addEventListener("click",function(event){
  const button=event.target.closest("[data-act]");
  if(!button || transitioning || (window.JHWorldFX && window.JHWorldFX.isPlaying())) return;
  const act=button.dataset.act;
  if(act==="exit-app"){
    if(window.JihengWorldBridge) window.JihengWorldBridge.postMessage(JSON.stringify({type:"exit"}));
    return;
  }
  if(act==="back-world"){ backToWorld(); return; }
  if(act==="close"){overlay=null;render();return;}
  if(act==="open-map"){overlay="map";render();return;}
  if(act==="open-bag"){if(S.report){S.report=false;} overlay="bag";render();return;}
  if(act==="open-history"){overlay="history";render();return;}
  if(act==="open-material-offer" && currentScene().id==="materials"){overlay="material-offer";render();return;}
  if(act==="open-material-guide" && currentScene().id==="materials"){overlay="material-guide";render();return;}
  if(currentScene().id==="cell"){
    if(act==="open-cell-mission"){overlay="cell-mission";render();return;}
    if(act==="open-cell-hint"){overlay="cell-hint";render();return;}
    if(act==="toggle-cell-chat"){cellChatOpen=!cellChatOpen;render();if(cellChatOpen){const input=document.getElementById("playerInput");if(input) input.focus({preventScroll:true});}return;}
    if(act==="open-cell-analysis" && cellCount(progress(currentScene()))===3){overlay="cell-analysis";render();return;}
    if(act==="cell-inspect"){
      button.classList.add("inspecting");
      const stationId=button.dataset.station;
      const p=progress(currentScene());
      if(window.JHWorldFX && !cellCardOwned(p,stationId)){
        window.JHWorldFX.playScan(document.getElementById("world"),stationId,function(){
          if(currentScene().id==="cell") openCellInteraction(currentScene(),progress(currentScene()),stationId);
        });
      }else setTimeout(function(){openCellInteraction(currentScene(),progress(currentScene()),stationId);},160);
      return;
    }
    if(act==="cell-timeline-complete"){completeCellTimeline(currentScene(),progress(currentScene()));return;}
    if(act==="cell-market-choice"){answerCellMarket(currentScene(),progress(currentScene()),button.dataset.choice);return;}
    if(act==="collect-cell-card"){collectCellCard(currentScene(),progress(currentScene()),button.dataset.card);return;}
    if(act==="submit-cell-analysis"){submitCellAnalysis(currentScene(),progress(currentScene()));return;}
    if(act==="complete-cell-area"){completeCellArea(currentScene(),progress(currentScene()));return;}
  }
  if(act==="inspect-material" && currentScene().id==="materials"){
    const clue=MATERIAL_CLUES[button.dataset.clue];
    if(clue) speak(clue.prompt,"inspect",button.dataset.clue);
    return;
  }
  if(act==="material-offer" && currentScene().id==="materials"){
    const offer=MATERIAL_OFFERS[button.dataset.route];
    if(offer) speak(offer.prompt,"material-offer",button.dataset.route);
    return;
  }
  if(act==="prompt"){speak(button.dataset.text,button.dataset.intent);return;}
  if(act==="present"){
    const item=ALL_SCROLLS.get(button.dataset.scroll);
    if(item) speak("我把「"+item.title+"」拿给你看。","present",item.id);
    return;
  }
  if(act==="map-node"){
    const index=Number(button.dataset.index);
    if(Number.isInteger(index) && index<=S.unlocked){
      if(S.report){S.report=false;saveState();}
      transitionTo(index);
    }
    return;
  }
  if(act==="travel"){
    if(currentScene().id==="cell"){overlay="map";render();return;}
    if(S.current===SCENES.length-1){finishJourney();return;}
    if(S.unlocked>S.current) transitionTo(S.current+1);
    return;
  }
  if(act==="back-scene"){S.report=false;overlay=null;saveState();render();return;}
  if(act==="reset"){
    if(confirm("重新开始会清空这一趟走访的对话和卷轴。确定重新开始吗？")){
      if(window.JHWorldFX) window.JHWorldFX.cancel();
      try{localStorage.removeItem(STORAGE_KEY);}catch(_error){}
      S=freshState();overlay=null;toastText="";busy=false;transitioning=false;render();
    }
  }
});
app.addEventListener("input",function(event){
  if(event.target.matches('[data-act="cell-timeline"]')) updateCellTimeline(event.target.value);
});
app.addEventListener("pointerdown",function(event){
  const card=event.target.closest("[data-drag-card]");
  if(!card || card.disabled || transitioning) return;
  activePointerDrag={id:card.dataset.dragCard,element:card,x:event.clientX,y:event.clientY};
  card.classList.add("dragging");
  event.preventDefault();
});
app.addEventListener("pointermove",function(event){
  if(!activePointerDrag) return;
  const dx=event.clientX-activePointerDrag.x,dy=event.clientY-activePointerDrag.y;
  activePointerDrag.element.style.translate=dx+"px "+dy+"px";
  const over=document.elementFromPoint(event.clientX,event.clientY);
  const zone=over&&over.closest("[data-drop-zone]");
  app.querySelectorAll("[data-drop-zone].ready").forEach(function(item){item.classList.remove("ready");});
  if(zone) zone.classList.add("ready");
  event.preventDefault();
});
function finishCellDrag(event){
  if(!activePointerDrag) return;
  const drag=activePointerDrag;
  const over=document.elementFromPoint(event.clientX,event.clientY);
  const zone=over&&over.closest("[data-drop-zone]");
  drag.element.classList.remove("dragging");drag.element.style.translate="";
  app.querySelectorAll("[data-drop-zone].ready").forEach(function(item){item.classList.remove("ready");});
  activePointerDrag=null;
  if(!zone) return;
  const scene=currentScene(),p=progress(scene),type=zone.dataset.dropZone;
  if(type==="factory" && drag.id==="factory") completeFactoryUpgrade(scene,p);
  if(type==="analysis" && drag.id.indexOf("analysis:")===0) connectCellCard(p,drag.id.slice(9));
}
app.addEventListener("pointerup",finishCellDrag);
app.addEventListener("pointercancel",finishCellDrag);
app.addEventListener("submit",function(event){
  if(event.target.id!=="speakForm") return;
  event.preventDefault();
  const input=document.getElementById("playerInput");
  if(input) speak(input.value);
});
document.addEventListener("keydown",function(event){
  if(event.key==="Escape" && overlay){overlay=null;render();}
});
progress(currentScene());
render();
</script>
