name: jiheng_ai_flutter
description: Flutter conversion of the first four Jiheng AI prototype screens.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_markdown_plus: ^1.0.12
  flutter_secure_storage: ^9.2.2
  http: ^1.2.2
  webview_flutter: ^4.14.1
  url_launcher: ^6.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - logo.png
    - assets/prototype/
    - assets/game/
    - assets/game/assets/
    - assets/game/static/
  fonts:
    - family: Noto Serif SC
      fonts:
        - asset: assets/fonts/NotoSerifSC-subset.ttf
