<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>玑衡 World v2 · 调查版</title>
  <style>
    :root {
      --bg:#0c1222; --bg2:#111c32; --ink:#edf2ff; --muted:#8d9cbd; --line:#304362;
      --panel:#17233bde; --soft:#ffffff0b; --gold:#efbc72; --teal:#71d3b7;
      --blue:#81aefc; --pink:#ed8b98; --violet:#b99bea; --shadow:0 24px 70px #00000038;
    }
    * { box-sizing:border-box; }
    html,body { min-height:100%; margin:0; }
    body { color:var(--ink); font:14px/1.55 Inter,"Microsoft YaHei",sans-serif; background:radial-gradient(circle at 78% 0%,#4b3c762f,transparent 30%),radial-gradient(circle at 0% 75%,#236b6b24,transparent 32%),linear-gradient(135deg,var(--bg),#0b1020 65%,#121a2f); }
    body::before { content:""; position:fixed; inset:0; pointer-events:none; opacity:.16; background-image:linear-gradient(#ffffff0b 1px,transparent 1px),linear-gradient(90deg,#ffffff0b 1px,transparent 1px); background-size:34px 34px; mask-image:linear-gradient(to bottom,#000,transparent 92%); }
    button { font:inherit; cursor:pointer; }
    a { color:inherit; text-decoration:none; }
    .v2-app { max-width:1640px; min-height:100vh; margin:auto; padding:22px 24px 34px; position:relative; }
    .v2-topbar { display:flex; align-items:center; justify-content:space-between; gap:18px; margin-bottom:18px; }
    .brand { display:flex; align-items:center; gap:12px; }
    .brand-mark { width:45px; height:45px; display:grid; place-items:center; border:1px solid #ffe1a08f; border-radius:15px; background:linear-gradient(145deg,#f5c875,#71d3b7); box-shadow:0 8px 28px #efbc7250,inset 0 0 0 4px #ffffff25; }
    .brand-mark svg { width:37px; height:37px; }
    .brand h1 { margin:0; display:flex; align-items:baseline; gap:8px; font-size:21px; letter-spacing:.04em; }
    .brand h1 small { color:#a8b8dc; font-size:11px; letter-spacing:.22em; }
    .brand p { margin:2px 0 0; color:var(--muted); font-size:11px; }
    .top-actions { display:flex; align-items:center; gap:8px; flex-wrap:wrap; justify-content:flex-end; }
    .pill,.back { border:1px solid #4e6288; border-radius:999px; padding:7px 11px; color:#cbd7f1; background:#ffffff08; font-size:11px; }
    .pill.live { color:#aaf2d9; border-color:#438f7b; background:#16816620; }
    .back:hover { background:#ffffff15; }
    .world-grid { display:grid; grid-template-columns:238px minmax(620px,1fr) 270px; gap:15px; align-items:start; }
    .panel { border:1px solid #344a6d; border-radius:22px; background:var(--panel); box-shadow:var(--shadow); backdrop-filter:blur(17px); }
    .rail,.inspector { padding:16px; position:sticky; top:16px; }
    .kicker { color:#91a7d8; font-size:10px; font-weight:900; letter-spacing:.15em; text-transform:uppercase; }
    .rail h2,.inspector h2 { margin:4px 0 0; font-size:18px; }
    .muted { color:var(--muted); font-size:12px; }
    .player-card { display:flex; gap:10px; align-items:center; margin:15px 0 18px; padding:11px; border:1px solid #71d3b766; border-radius:15px; background:linear-gradient(145deg,#71d3b714,#efbc7210); }
    .player-face { width:41px; height:41px; display:grid; place-items:center; flex:none; border:1px solid #ffe1a0; border-radius:13px 13px 7px 13px; color:#19243d; background:linear-gradient(145deg,#ffe5a8,#71d3b7); font-weight:900; }
    .player-card b { display:block; font-size:12px; } .player-card span { display:block; color:#a9e5d4; font-size:10px; margin-top:2px; }
    .chapter-list { display:grid; gap:7px; margin-top:12px; }
    .chapter { display:flex; gap:9px; align-items:center; padding:8px; border:1px solid transparent; border-radius:12px; background:#ffffff05; }
    .chapter.current { border-color:#efbc727a; background:#efbc7213; }
    .chapter.done { color:#cff5e8; }
    .chapter-num { width:24px; height:24px; display:grid; place-items:center; border:1px solid #53688f; border-radius:8px; color:#9badd3; font-size:10px; font-weight:900; }
    .chapter.done .chapter-num { color:#10273a; border-color:var(--teal); background:var(--teal); }
    .chapter b { display:block; font-size:11px; } .chapter small { display:block; color:#8291b4; font-size:10px; margin-top:1px; }
    .bag { margin-top:20px; padding-top:14px; border-top:1px solid #33486a; }
    .bag-head { display:flex; justify-content:space-between; gap:8px; align-items:center; }
    .bag-count { color:#a7ecd8; font-size:11px; }
    .clues { display:grid; gap:7px; margin-top:9px; }
    .clue { padding:8px; border-left:3px solid var(--teal); border-radius:7px; background:#ffffff07; }
    .clue.derived { border-left-color:var(--violet); }
    .clue b { display:block; font-size:10px; } .clue small { display:block; color:#8494b7; font-size:9px; margin-top:2px; }
    .empty { color:#7f8eae; font-size:11px; padding:9px 0; }
    .map-panel { min-height:770px; overflow:hidden; }
    .map-head { display:flex; justify-content:space-between; align-items:flex-start; gap:15px; padding:18px 20px 0; }
    .map-head h2 { margin:3px 0 0; font-size:24px; }
    .map-head p { margin:3px 0 0; color:#a4b2d1; font-size:12px; }
    .map-meta { max-width:210px; color:#aab7d3; font-size:10px; text-align:right; }
    .map-stage { height:620px; position:relative; margin:14px; overflow:hidden; border:1px solid #3b5379; border-radius:20px; background:radial-gradient(circle at 50% 53%,#3e71834a,transparent 25%),radial-gradient(circle at 84% 20%,#a98eec24,transparent 25%),linear-gradient(145deg,#12223c,#162c4c 55%,#15243d); }
    .map-stage::before { content:""; position:absolute; inset:0; background-image:linear-gradient(#bbd1ef0b 1px,transparent 1px),linear-gradient(90deg,#bbd1ef0b 1px,transparent 1px); background-size:28px 28px; }
    .map-stage::after { content:""; position:absolute; width:340px; height:340px; left:50%; top:53%; transform:translate(-50%,-50%); border:1px solid #71d3b72b; border-radius:50%; box-shadow:0 0 0 34px #71d3b709,0 0 0 72px #71d3b705; pointer-events:none; }
    .route-lines { position:absolute; inset:0; width:100%; height:100%; z-index:1; }
    .route { fill:none; stroke:#6f85a777; stroke-width:2; stroke-dasharray:6 8; animation:flow 12s linear infinite; }
    .route.reachable { stroke:#efbc72b5; filter:drop-shadow(0 0 4px #efbc725c); }
    .route.lit { stroke:#71d3b7d9; filter:drop-shadow(0 0 5px #71d3b788); }
    @keyframes flow { to { stroke-dashoffset:-120; } }
    .player { position:absolute; z-index:2; left:50%; top:53%; width:182px; height:260px; display:flex; justify-content:center; align-items:flex-end; transform:translate(-50%,-50%); pointer-events:none; }
    .player::before { content:""; position:absolute; bottom:8px; width:170px; height:170px; border-radius:50%; background:#71d3b72b; box-shadow:0 0 50px 25px #71d3b714; }
    .player img { position:relative; z-index:1; width:188px; height:250px; object-fit:contain; filter:drop-shadow(0 18px 17px #00000079); }
    .player-tag { position:absolute; z-index:3; bottom:-9px; padding:5px 11px; border:1px solid #8be2ca; border-radius:999px; color:#e2fff6; background:#132f3be8; white-space:nowrap; font-size:10px; font-weight:900; }
    .node { position:absolute; z-index:4; width:128px; min-height:84px; padding:10px; transform:translate(-50%,-50%); border:1px solid color-mix(in srgb,var(--node-color) 68%,#ffffff); border-radius:16px; color:#eef4ff; text-align:left; background:linear-gradient(145deg,color-mix(in srgb,var(--node-color) 22%,#172849),#12203adb); box-shadow:0 12px 28px #00000043; transition:.2s ease; }
    .node:hover { transform:translate(-50%,-50%) translateY(-4px) scale(1.025); filter:brightness(1.1); }
    .node.fog { opacity:.45; filter:grayscale(.65) blur(.5px); border-style:dashed; }
    .node.fog:hover { opacity:.76; filter:grayscale(.1) blur(0); }
    .node.lit { box-shadow:0 0 0 3px color-mix(in srgb,var(--node-color) 38%,transparent),0 12px 28px #00000052; }
    .node.focus { animation:focus 2.2s ease-in-out infinite; }
    @keyframes focus { 50% { box-shadow:0 0 0 8px #efbc7230,0 12px 28px #00000052; } }
    .node .node-icon { width:23px; height:23px; display:grid; place-items:center; border-radius:8px; color:#152139; background:var(--node-color); font-size:13px; font-weight:900; }
    .node b { display:block; margin-top:5px; font-size:12px; } .node small { display:block; margin-top:2px; color:#c0cce6; font-size:9px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .node-action { display:block; margin-top:6px; color:#a8f1da; font-size:9px; }
    .map-hint { position:absolute; z-index:5; left:17px; bottom:15px; padding:6px 9px; border:1px solid #5f77a366; border-radius:999px; color:#c6d5f2; background:#071125ad; font-size:10px; }
    .map-footer { display:flex; justify-content:space-between; gap:12px; align-items:center; padding:0 18px 17px; }
    .progress { flex:1; } .progress-head { display:flex; justify-content:space-between; color:#b2c0dc; font-size:11px; } .progress-track { display:flex; gap:5px; margin-top:7px; } .progress-track i { height:5px; flex:1; border-radius:99px; background:#405374; } .progress-track i.on { background:var(--teal); box-shadow:0 0 8px #71d3b788; }
    .map-note { max-width:280px; color:#8f9fc1; font-size:10px; text-align:right; }
    .inspector .focus-card { margin-top:14px; padding:12px; border:1px solid #4b6086; border-radius:15px; background:#ffffff07; }
    .focus-card .focus-label { color:var(--gold); font-size:10px; font-weight:900; letter-spacing:.1em; text-transform:uppercase; }
    .focus-card h3 { margin:5px 0 3px; font-size:16px; } .focus-card p { margin:0; color:#bdc9e3; font-size:11px; }
    .signal { margin-top:12px; padding:10px; border-left:3px solid var(--teal); border-radius:7px; color:#cfe9e0; background:#71d3b712; font-size:11px; }
    .hint-box { margin-top:12px; padding:11px; border:1px dashed #51668d; border-radius:13px; color:#aab8d4; font-size:11px; }
    .hint-box b { display:block; color:#dde7fb; margin-bottom:4px; }
    .scene-layer { position:fixed; inset:0; z-index:20; display:none; align-items:center; justify-content:center; padding:20px; background:#050916e6; backdrop-filter:blur(12px); }
    .scene-layer.show { display:flex; }
    .scene { width:min(1120px,100%); max-height:94vh; overflow:auto; border:1px solid #58709a; border-radius:26px; background:linear-gradient(145deg,#1c2c4e,#10192f); box-shadow:0 34px 110px #000000a8; animation:rise .28s ease both; }
    @keyframes rise { from { opacity:0; transform:translateY(14px) scale(.98); } to { opacity:1; transform:none; } }
    .scene-header { display:flex; justify-content:space-between; gap:15px; align-items:flex-start; padding:20px 22px 12px; }
    .scene-header h2 { margin:4px 0 0; font-size:26px; } .scene-header p { margin:3px 0 0; color:#aab9d8; font-size:12px; }
    .close { border:1px solid #586c93; border-radius:10px; padding:7px 10px; color:#d2ddf6; background:#ffffff08; }
    .scene-grid { display:grid; grid-template-columns:270px 1fr; gap:16px; padding:0 22px 22px; }
    .scene-visual { min-height:480px; position:relative; overflow:hidden; border:1px solid #40577e; border-radius:19px; background:radial-gradient(circle at 50% 30%,#efbc7230,transparent 34%),linear-gradient(160deg,#172a48,#11182f); }
    .scene-visual::before { content:""; position:absolute; inset:0; opacity:.4; background-image:linear-gradient(#d0e1ff0b 1px,transparent 1px),linear-gradient(90deg,#d0e1ff0b 1px,transparent 1px); background-size:24px 24px; }
    .scene-visual img { position:absolute; z-index:1; left:50%; bottom:24px; width:255px; height:390px; transform:translateX(-50%); object-fit:contain; filter:drop-shadow(0 20px 18px #00000076); }
    .scene-visual-label { position:absolute; z-index:3; left:50%; bottom:13px; transform:translateX(-50%); white-space:nowrap; border:1px solid #8be2ca; border-radius:99px; padding:5px 10px; color:#e3fff7; background:#132f3be8; font-size:10px; font-weight:900; }
    .scene-visual-copy { position:absolute; z-index:2; left:14px; right:14px; top:14px; padding:10px; border:1px solid #53688e; border-radius:12px; color:#d4def5; background:#081126ad; font-size:11px; }
    .scene-visual-copy b { display:block; margin-bottom:3px; color:#f3d18f; font-size:10px; }
    .scene-main { min-width:0; }
    .coach { display:flex; gap:9px; align-items:center; padding:10px 12px; border:1px solid #496084; border-radius:14px; background:#ffffff08; }
    .coach-face { width:30px; height:30px; display:grid; place-items:center; flex:none; border-radius:10px 10px 4px 10px; color:#17233d; background:#8fbaff; font-weight:900; }
    .coach b { display:block; font-size:11px; } .coach span { display:block; margin-top:2px; color:#afbddb; font-size:10px; }
    .scene-main h3 { margin:16px 0 8px; font-size:14px; }
    .object-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:9px; }
    .object { min-height:150px; border:1px solid #4d628a; border-radius:15px; padding:11px; text-align:left; color:#dce7fb; background:#ffffff07; transition:.18s; }
    .object:hover { transform:translateY(-3px); border-color:#9ab7ef; background:#ffffff11; }
    .object.seen { border-color:var(--teal); background:#71d3b714; }
    .object b { display:block; font-size:12px; } .object small { display:block; margin-top:3px; color:#91a1c2; font-size:10px; } .object p { margin:12px 0 0; color:#c8d5ee; font-size:11px; line-height:1.55; }
    .desk { margin-top:13px; padding:12px; border:1px solid #4b628d; border-radius:16px; background:linear-gradient(145deg,#ffffff0d,#ffffff04); }
    .desk-head { display:flex; justify-content:space-between; gap:8px; align-items:center; } .desk-head b { font-size:12px; } .desk-head span { color:#a1b0d0; font-size:10px; }
    .desk-line { display:flex; gap:7px; align-items:center; margin-top:11px; min-height:34px; }
    .desk-chip { padding:7px 9px; border:1px solid #6b7fa4; border-radius:9px; color:#d8e5fb; background:#ffffff09; font-size:10px; }
    .desk-arrow { color:var(--gold); font-weight:900; }
    .insight { margin-top:12px; padding:12px; border:1px solid #efbc7270; border-radius:14px; background:#efbc7212; }
    .insight small { color:#ffd991; font-size:10px; letter-spacing:.1em; text-transform:uppercase; font-weight:900; } .insight h4 { margin:4px 0; font-size:14px; } .insight p { margin:0; color:#e1d5b8; font-size:11px; }
    .scene-actions { display:flex; justify-content:flex-end; gap:8px; margin-top:12px; } .return { border:0; border-radius:10px; padding:10px 13px; color:#14233d; background:var(--teal); font-weight:900; } .return:disabled { cursor:not-allowed; opacity:.38; filter:grayscale(1); }
    @media (max-width:1180px) { .world-grid { grid-template-columns:210px minmax(500px,1fr); } .inspector { grid-column:2; position:static; } .inspector .focus-card { max-width:600px; } }
    @media (max-width:820px) { .v2-app { padding:15px 12px 30px; } .v2-topbar { display:block; } .top-actions { justify-content:flex-start; margin-top:12px; } .world-grid { grid-template-columns:1fr; } .rail,.inspector { position:static; } .map-panel { order:-1; min-height:auto; } .map-stage { height:560px; } .scene-grid { grid-template-columns:190px 1fr; gap:11px; padding:0 14px 14px; } .scene-visual { min-height:400px; } .scene-visual img { width:200px; height:330px; } }
    @media (max-width:560px) { .brand h1 { font-size:19px; } .brand p { font-size:10px; } .map-stage { height:480px; margin:10px 8px; } .player { transform:translate(-50%,-50%) scale(.72); } .node { width:105px; min-height:75px; padding:8px; } .node b { font-size:10px; } .node small,.node-action { font-size:8px; } .scene-layer { padding:8px; } .scene-header { padding:14px 14px 9px; } .scene-header h2 { font-size:21px; } .scene-grid { display:block; padding:0 14px 14px; } .scene-visual { min-height:190px; margin-bottom:10px; } .scene-visual img { width:130px; height:205px; bottom:-2px; } .scene-visual-copy { left:10px; right:10px; max-width:58%; font-size:10px; } .object-grid { grid-template-columns:1fr; } .object { min-height:90px; } .desk-line { overflow:auto; } .scene-actions { display:block; } .return { width:100%; } }
  </style>
</head>
<body>
  <div id="app"><div class="empty">正在打开调查世界…</div></div>
  <div id="sceneLayer" class="scene-layer"></div>
  <script>
    const app = document.getElementById('app');
    const sceneLayer = document.getElementById('sceneLayer');
    const query = new URLSearchParams(location.search);
    const code = query.get('code') || '300750';
    const saveKey = 'jiheng-world-v2-' + code;
    let saved = {};
    try { saved = JSON.parse(sessionStorage.getItem(saveKey) || '{}') || {}; } catch (_) { saved = {}; }
    const state = {
      scenario: null,
      opened: new Set(Array.isArray(saved.opened) ? saved.opened : []),
      chapter: Number.isFinite(Number(saved.chapter)) ? Math.max(0, Math.floor(Number(saved.chapter))) : 0,
      scene: null,
      discovered: new Set(),
      focusObject: null,
      note: '',
      progress: saved.progress && typeof saved.progress === 'object' ? saved.progress : {},
    };
    const esc = value => String(value == null ? '' : value).replace(/[&<>'"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
    const byId = id => state.scenario.nodes.find(node => node.id === id);
    const currentChapter = () => state.scenario.chapters[state.chapter];
    const isOpened = id => state.opened.has(id);
    const isUnlocked = node => node.initially_unlocked || node.unlock_after.every(id => state.opened.has(id));
    const chapterDone = chapter => chapter.node_ids.every(id => isOpened(id));
    const maxChapter = () => {
      let max = 0;
      for (let i = 1; i < state.scenario.chapters.length; i += 1) {
        if (!chapterDone(state.scenario.chapters[i - 1])) break;
        max = i;
      }
      return max;
    };
    const persist = () => sessionStorage.setItem(saveKey, JSON.stringify({ opened:[...state.opened], chapter:state.chapter, progress:state.progress }));

    function render() {
      const s = state.scenario;
      const chapter = currentChapter();
      const allDone = s.nodes.every(node => isOpened(node.id));
      app.innerHTML =
        "<div class='v2-app'>" +
          "<header class='v2-topbar'>" +
            "<a class='brand' href='/' aria-label='返回研究台'><div class='brand-mark'><svg viewBox='0 0 64 64' fill='none'><circle cx='32' cy='32' r='24' fill='#19243F' stroke='#FFF0C5' stroke-width='1.5'/><path d='M10 32C17 17 27 10 32 10C37 10 47 17 54 32C47 47 37 54 32 54C27 54 17 47 10 32Z' stroke='#71D3B7' stroke-width='2'/><path d='M32 10V54M10 32H54' stroke='#EFBC72' stroke-width='1.5'/><circle cx='32' cy='32' r='5' fill='#EFBC72' stroke='#FFF0C5' stroke-width='2'/></svg></div><div><h1>玑衡 <small>WORLD · FIELDWORK</small></h1><p>一家公司，五个现场，自己走出来的理解</p></div></a>" +
            "<div class='top-actions'><span class='pill live'>● 调查版 v2</span><span class='pill'>演示历史快照</span><a class='back' href='/'>返回研究台</a></div>" +
          "</header>" +
          "<main class='world-grid'>" +
            renderRail(s, chapter) +
            "<section class='panel map-panel'>" +
              "<div class='map-head'><div><div class='kicker'>Company world / " + esc(s.code) + "</div><h2>" + esc(s.world_name) + "</h2><p>不是答题地图。你在这里发现一家公司如何被上下游牵动。</p></div><div class='map-meta'>" + esc(s.notice) + "</div></div>" +
              "<div class='map-stage'><svg class='route-lines' viewBox='0 0 100 100' preserveAspectRatio='none'>" + renderRoutes() + "</svg><div class='player'><img src='/static/assets/guide-mo.png' alt='你，产业链探索者'/><span class='player-tag'>你 · 产业链探索者</span></div>" + s.nodes.map(renderNode).join('') + "<div class='map-hint'>点击节点进入现场，调查完成后它会被你点亮</div></div>" +
              "<div class='map-footer'><div class='progress'><div class='progress-head'><span>你的调查轨迹</span><span>" + state.opened.size + " / " + s.nodes.length + " 个现场</span></div><div class='progress-track'>" + s.nodes.map(node => "<i class='" + (isOpened(node.id) ? "on" : "") + "'></i>").join('') + "</div></div><div class='map-note'>" + (allDone ? "五个现场已经连成一条影响链。可以回到研究台继续深挖。" : "雾中的地点仍然存在，只是需要先沿着已经点亮的线路走过去。") + "</div></div>" +
            "</section>" +
            renderInspector(s, chapter, allDone) +
          "</main>" +
        "</div>";
      document.querySelectorAll('[data-node]').forEach(button => button.addEventListener('click', () => enterNode(button.dataset.node)));
      document.querySelectorAll('[data-chapter]').forEach(button => button.addEventListener('click', () => focusChapter(Number(button.dataset.chapter))));
      renderScene();
    }

    function renderRail(s, chapter) {
      return "<aside class='panel rail'><div class='kicker'>Player profile</div><h2>你的调查档案</h2><div class='muted'>你不是来考试的，你是来现场看清楚一家公司。</div><div class='player-card'><div class='player-face'>你</div><div><b>产业链探索者</b><span>Fieldwork / Lv.1</span></div></div><div class='kicker'>Route</div><div class='chapter-list'>" + s.chapters.map((item, index) => "<div class='chapter " + (index === state.chapter ? "current " : "") + (chapterDone(item) ? "done" : "") + "'><div class='chapter-num'>" + esc(item.number) + "</div><div><b>" + esc(item.eyebrow) + "</b><small>" + esc(item.title) + "</small></div></div>").join('') + "</div><div class='bag'><div class='bag-head'><div class='kicker'>Evidence bag</div><span class='bag-count'>" + state.opened.size + " 条</span></div>" + renderClues(s) + "</div></aside>";
    }

    function renderClues(s) {
      const clues = s.nodes.filter(node => state.opened.has(node.id)).map(node => node.clue);
      if (!clues.length) return "<div class='empty'>还没有线索。先进入地图上的第一个现场。</div>";
      return "<div class='clues'>" + clues.map(clue => "<div class='clue " + clue.kind + "'><b>" + esc(clue.id) + " · " + esc(clue.title) + "</b><small>" + (clue.kind === "hard" ? "硬数据" : "AI 推断") + " · " + esc(clue.source) + "</small></div>").join('') + "</div>";
    }

    function renderInspector(s, chapter, allDone) {
      const focus = state.note ? null : chapter.node_ids.map(byId).find(Boolean);
      const node = focus || (state.note && byId(state.note.nodeId));
      let copy = state.note ? state.note.text : (node ? "这一段链路的现场已经标在地图上。点击地点，进入后自己调查。" : "点击地图上的任意地点。");
      return "<aside class='panel inspector'><div class='kicker'>Field note</div><h2>当前观察</h2><div class='focus-card'><div class='focus-label'>" + (node ? esc(node.caption) : "自由探索") + "</div><h3>" + (node ? esc(node.label) : "从地图开始") + "</h3><p>" + esc(copy) + "</p></div><div class='signal'>" + (allDone ? "你已经把五个现场连起来了。" : "这里没有标准答案。先看一个现场，再决定自己相信哪条线。") + "</div><div class='hint-box'><b>怎么玩</b>点击一个地点 → 看见现场物件 → 把线索带回地图。完成一个现场，线路会变亮。</div></aside>";
    }

    function renderRoutes() {
      return state.scenario.nodes.flatMap(node => node.unlock_after.map(parentId => {
        const parent = byId(parentId);
        if (!parent) return "";
        const cls = isOpened(node.id) ? "lit" : isUnlocked(node) ? "reachable" : "";
        return "<line class='route " + cls + "' x1='" + parent.x + "' y1='" + parent.y + "' x2='" + node.x + "' y2='" + node.y + "'/>";
      })).join('');
    }

    function renderNode(node) {
      const unlocked = isUnlocked(node);
      const opened = isOpened(node.id);
      const focused = currentChapter().node_ids.includes(node.id);
      const classes = ["node"];
      if (!unlocked) classes.push("fog");
      if (opened) classes.push("lit");
      if (focused) classes.push("focus");
      const icon = opened ? "✓" : unlocked ? "⌁" : "⌕";
      const action = opened ? "重新进入现场" : unlocked ? "进入现场调查" : "先调查上游";
      return "<button class='" + classes.join(" ") + "' style='left:" + node.x + "%;top:" + node.y + "%;--node-color:" + node.color + "' data-node='" + node.id + "'><span class='node-icon'>" + icon + "</span><b>" + esc(node.label) + "</b><small>" + esc(node.caption) + "</small><span class='node-action'>" + action + "</span></button>";
    }

    function enterNode(id) {
      const node = byId(id);
      if (!node) return;
      if (!isUnlocked(node)) {
        state.note = { nodeId:id, text:"这条线路还在雾里。先完成「" + (byId(node.unlock_after[0]) || {label:"上一站"}).label + "」，这里才会开放。" };
        render();
        return;
      }
      const old = state.progress[id] || [];
      state.scene = id;
      state.discovered = new Set(isOpened(id) ? node.scene.objects.map(object => object.id) : old);
      state.focusObject = null;
      state.note = null;
      renderScene();
    }

    function closeScene() {
      if (state.scene && state.discovered.size && !isOpened(state.scene)) {
        state.progress[state.scene] = [...state.discovered];
        persist();
      }
      state.scene = null;
      state.discovered = new Set();
      state.focusObject = null;
      sceneLayer.classList.remove('show');
      sceneLayer.innerHTML = '';
      render();
    }

    function investigate(objectId) {
      if (!state.scene) return;
      const node = byId(state.scene);
      const object = node.scene.objects.find(item => item.id === objectId);
      if (!object) return;
      state.discovered.add(objectId);
      state.focusObject = objectId;
      state.progress[state.scene] = [...state.discovered];
      persist();
      renderScene();
    }

    function completeScene() {
      if (!state.scene) return;
      const node = byId(state.scene);
      if (!node || state.discovered.size !== node.scene.objects.length) return;
      state.opened.add(node.id);
      delete state.progress[node.id];
      persist();
      state.note = { nodeId:node.id, text:node.scene.takeaway };
      state.scene = null;
      state.discovered = new Set();
      state.focusObject = null;
      sceneLayer.classList.remove('show');
      sceneLayer.innerHTML = '';
      render();
    }

    function renderScene() {
      if (!state.scene) {
        sceneLayer.classList.remove('show');
        sceneLayer.innerHTML = '';
        return;
      }
      const node = byId(state.scene);
      const scene = node.scene;
      const allSeen = state.discovered.size === scene.objects.length;
      const focus = scene.objects.find(object => object.id === state.focusObject);
      sceneLayer.innerHTML = "<section class='scene' role='dialog' aria-modal='true'><header class='scene-header'><div><div class='kicker'>" + esc(scene.eyebrow) + "</div><h2>" + esc(scene.title) + "</h2><p>你在现场。没有选择题，先把这里的东西看明白。</p></div><button class='close' data-close>离开现场</button></header><div class='scene-grid'><div class='scene-visual'><div class='scene-visual-copy'><b>现场引子</b>" + esc(scene.intro) + "</div><img src='/static/assets/guide-mo.png' alt='你，产业链探索者'/><span class='scene-visual-label'>你 · 正在调查</span></div><div class='scene-main'><div class='coach'><div class='coach-face'>墨</div><div><b>墨 · 档案官</b><span>先看现场，不急着得出结论。</span></div></div><h3>现场物件 · 点击查看</h3><div class='object-grid'>" + scene.objects.map(object => {
        const seen = state.discovered.has(object.id);
        return "<button class='object " + (seen ? "seen" : "") + "' data-object='" + object.id + "'><b>" + (seen ? "✓ " : "") + esc(object.label) + "</b><small>" + esc(object.caption) + "</small><p>" + (seen ? esc(object.detail) : "点击调查，看看它和产业链有什么关系。") + "</p></button>";
      }).join('') + "</div><div class='desk'><div class='desk-head'><b>你的证据桌</b><span>" + state.discovered.size + " / " + scene.objects.length + " 条现场线索</span></div><div class='desk-line'>" + (state.discovered.size ? scene.objects.filter(object => state.discovered.has(object.id)).map(object => "<span class='desk-chip'>" + esc(object.label) + "</span>").join("<span class='desk-arrow'>→</span>") : "<span class='empty'>点击物件后，线索会来到这里</span>") + "</div></div>" + (focus ? "<div class='signal'><b>" + esc(focus.label) + "</b>：你刚刚看到的是一条" + (focus.kind === "hard" ? "硬数据线索。" : "AI 推断线索。") + "</div>" : "") + (allSeen ? "<div class='insight'><small>你发现了</small><h4>这条现场线索如何影响公司？</h4><p>" + esc(scene.takeaway) + "</p></div>" : "") + "<div class='scene-actions'><button class='return' data-complete " + (allSeen ? "" : "disabled") + ">" + (allSeen ? "带着这条线索返回地图" : "先调查完所有物件") + "</button></div></div></div></section>";
      sceneLayer.classList.add('show');
      sceneLayer.querySelector('[data-close]').addEventListener('click', closeScene);
      sceneLayer.querySelectorAll('[data-object]').forEach(button => button.addEventListener('click', () => investigate(button.dataset.object)));
      sceneLayer.querySelector('[data-complete]').addEventListener('click', completeScene);
    }

    function focusChapter(index) {
      if (index < 0 || index >= state.scenario.chapters.length) return;
      state.chapter = Math.min(index, maxChapter());
      state.note = null;
      persist();
      render();
    }

    async function boot() {
      try {
        const response = await fetch('/api/world/' + encodeURIComponent(code));
        const data = await response.json();
        if (!response.ok || !data.available) throw new Error(data.message || '世界档案无法读取');
        state.scenario = data;
        const ids = new Set(data.nodes.map(node => node.id));
        state.opened = new Set([...state.opened].filter(id => ids.has(id)));
        state.chapter = Math.min(state.chapter, maxChapter());
        persist();
        render();
      } catch (error) {
        app.innerHTML = "<div class='empty'>调查世界暂时失联：" + esc(error.message) + "</div>";
      }
    }
    boot();
  </script>
</body>
</html>
