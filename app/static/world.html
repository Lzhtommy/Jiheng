<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>玑衡 World · 产业链世界</title>
  <style>
    :root {
      --ink: #e9edff;
      --muted: #a2abc8;
      --line: #334264;
      --night: #11172c;
      --night-deep: #0a0e1e;
      --panel: rgba(24, 33, 63, .86);
      --panel-soft: rgba(33, 44, 79, .7);
      --teal: #71d3b7;
      --gold: #efbc72;
      --blue: #81aefc;
      --pink: #ed8b98;
      --purple: #d99ad5;
      --shadow: 0 18px 55px rgba(0, 0, 0, .28);
    }
    * { box-sizing: border-box; }
    html { min-height: 100%; background: var(--night-deep); }
    body {
      min-height: 100vh;
      margin: 0;
      color: var(--ink);
      font: 14px/1.55 Inter, "Microsoft YaHei", sans-serif;
      background:
        radial-gradient(circle at 78% 8%, #3a2f6655 0, transparent 30%),
        radial-gradient(circle at 15% 58%, #1e5d7452 0, transparent 30%),
        linear-gradient(145deg, #0a0e1e 0%, #121a34 50%, #0b1021 100%);
      overflow-x: hidden;
    }
    body::before {
      content: ""; position: fixed; inset: 0; pointer-events: none; opacity: .23;
      background-image: linear-gradient(#ffffff0c 1px, transparent 1px), linear-gradient(90deg, #ffffff0c 1px, transparent 1px);
      background-size: 32px 32px;
      mask-image: linear-gradient(to bottom, #000, transparent 90%);
    }
    a { color: inherit; text-decoration: none; }
    button, textarea { font: inherit; }
    button { cursor: pointer; }
    .app { max-width: 1560px; margin: 0 auto; padding: 22px 26px 42px; position: relative; }
    .topbar { display:flex; justify-content:space-between; gap:18px; align-items:center; margin-bottom:20px; }
    .brand { display:flex; align-items:center; gap:12px; }
    .mark {
      width:43px; height:43px; display:grid; place-items:center; border-radius:14px; color:#11172c; font-weight:900; font-size:19px;
      background: linear-gradient(135deg, var(--gold), #ffe2a5); box-shadow: 0 8px 26px #efbc7255;
    }
    h1 { margin:0; font-size:22px; letter-spacing:.03em; }
    .subtitle { color:var(--muted); font-size:12px; margin-top:2px; }
    .top-actions { display:flex; align-items:center; flex-wrap:wrap; justify-content:flex-end; gap:8px; }
    .tag, .ghost-link { border:1px solid #526286; border-radius:999px; padding:6px 10px; color:#c9d4f6; font-size:12px; background:#ffffff08; }
    .tag.live { color:#aaf3d9; border-color:#3f9e82; background:#16816622; }
    .ghost-link:hover { background:#ffffff16; }
    .layout { display:grid; grid-template-columns:250px minmax(480px,1fr) 330px; gap:16px; align-items:start; }
    .panel { border:1px solid #425276; background:var(--panel); backdrop-filter:blur(16px); box-shadow:var(--shadow); border-radius:20px; }
    .crew { padding:16px; position:sticky; top:14px; }
    .eyebrow { color:#91a7d8; font-size:11px; letter-spacing:.14em; text-transform:uppercase; font-weight:800; }
    .crew h2, .task h2 { margin:4px 0 2px; font-size:17px; }
    .small { color:var(--muted); font-size:12px; }
    .player-card { margin:12px 0 15px; padding:11px; display:flex; gap:10px; align-items:center; border:1px solid #71d3b766; border-radius:15px; background:linear-gradient(135deg, #71d3b718, #efbc7210); box-shadow:0 8px 22px #00000018; }
    .player-avatar { width:44px; height:44px; flex:none; display:grid; place-items:center; border:1px solid #ffe1a0; border-radius:14px 14px 7px 14px; color:#18213c; font-weight:900; font-size:16px; background:linear-gradient(145deg, #ffe5a8, #71d3b7); box-shadow:inset -4px -4px #00000016, 0 0 0 4px #efbc7215; }
    .player-card b { display:block; font-size:13px; }
    .player-card span { display:block; color:#a9e5d4; font-size:11px; margin-top:2px; }
    .player-card em { display:block; margin-top:3px; color:#99a8ca; font-size:10px; font-style:normal; }
    .agents { display:grid; gap:9px; margin-top:14px; }
    .agent-card { display:flex; gap:10px; padding:9px; border:1px solid transparent; border-radius:14px; background:#ffffff07; transition:.2s ease; }
    .agent-card.active { border-color:var(--agent-color); background:linear-gradient(100deg, color-mix(in srgb, var(--agent-color) 14%, transparent), #ffffff08); transform:translateX(2px); }
    .pixel-avatar {
      width:38px; height:38px; flex:none; position:relative; display:grid; place-items:center; color:#11172c; font-size:21px; font-weight:900;
      background:var(--agent-color); border-radius:11px 11px 5px 11px; image-rendering:pixelated; box-shadow:inset -4px -4px #0000001f, 0 5px 12px #00000024;
    }
    .pixel-avatar::after { content:""; position:absolute; width:5px; height:5px; right:-3px; top:4px; background:var(--agent-color); box-shadow:-31px 31px 0 -1px var(--agent-color); }
    .agent-card b { display:block; font-size:13px; }
    .agent-card span { color:var(--muted); display:block; font-size:11px; margin-top:1px; }
    .agent-state { margin-left:auto; align-self:center; width:7px; height:7px; border-radius:50%; background:#6e7898; }
    .agent-card.active .agent-state { background:var(--agent-color); box-shadow:0 0 11px var(--agent-color); }
    .ledger { margin-top:18px; padding-top:15px; border-top:1px solid #405071; }
    .ledger-head { display:flex; align-items:center; justify-content:space-between; gap:8px; }
    .toggle { display:inline-flex; align-items:center; gap:6px; color:#bdc9e9; font-size:11px; user-select:none; }
    .toggle input { accent-color:var(--teal); width:14px; height:14px; }
    .clue-list { margin:10px 0 0; padding:0; list-style:none; display:grid; gap:7px; }
    .clue { border-left:3px solid #61739b; border-radius:7px; padding:7px 8px; background:#ffffff07; color:#d5ddf6; font-size:11px; }
    .clue.hard { border-left-color:var(--teal); }
    .clue.derived { border-left-color:var(--purple); }
    .clue .source { color:#94a2c9; display:block; margin-top:2px; }
    .no-clues { color:#8390b1; font-size:12px; padding:10px 0 4px; }

    .world-panel { min-height:744px; overflow:hidden; position:relative; }
    .world-head { padding:18px 20px 0; display:flex; gap:14px; justify-content:space-between; align-items:flex-start; }
    .world-head h2 { margin:2px 0; font-size:23px; }
    .world-head p { margin:3px 0 0; color:var(--muted); font-size:12px; }
    .snapshot { color:#cdd7f2; font-size:11px; padding:6px 8px; text-align:right; max-width:165px; }
    .chapter-strip { display:flex; gap:7px; padding:14px 18px 0; overflow:auto; scrollbar-width:thin; }
    .chapter-tab { min-width:104px; border:1px solid #435579; border-radius:12px; padding:8px 10px; color:#9da9c9; background:#ffffff06; text-align:left; transition:.18s ease; }
    .chapter-tab small { display:block; font-size:10px; letter-spacing:.08em; color:#7483a7; }
    .chapter-tab b { display:block; margin-top:2px; font-size:11px; white-space:nowrap; }
    .chapter-tab.current { border-color:var(--teal); background:#71d3b718; color:#e5fff5; box-shadow:0 0 0 2px #71d3b70f; }
    .chapter-tab.done { border-color:#6d8d9a; color:#caeee4; }
    .chapter-tab.locked { opacity:.48; cursor:not-allowed; }
    .chapter-page { animation:chapterIn .34s ease both; }
    @keyframes chapterIn { from { opacity:0; transform:translateX(14px); } to { opacity:1; transform:none; } }
    .chapter-intro { display:flex; justify-content:space-between; gap:14px; align-items:flex-end; padding:14px 20px 0; }
    .chapter-intro .eyebrow { color:var(--gold); }
    .chapter-intro h3 { margin:3px 0 0; font-size:18px; }
    .chapter-intro p { max-width:510px; color:#b8c5e2; font-size:12px; margin:3px 0 0; }
    .chapter-number { color:#efbc72aa; font-weight:900; font-size:42px; line-height:1; }
    .map {
      margin:13px 14px 14px; height:465px; position:relative; overflow:hidden; border:1px solid #415275; border-radius:18px;
      background:
        radial-gradient(circle at 52% 50%, #31509053 0, transparent 42%),
        radial-gradient(circle at 12% 72%, #8a6a3542 0, transparent 25%),
        linear-gradient(120deg, #14233f 0%, #182c54 50%, #162849 100%);
    }
    .map::before, .map::after { content:""; position:absolute; pointer-events:none; }
    .map::before { inset:0; background-image:linear-gradient(#a2b9e00c 1px, transparent 1px),linear-gradient(90deg, #a2b9e00c 1px, transparent 1px); background-size:24px 24px; }
    .map::after { width:260px; height:260px; top:-130px; right:-80px; border-radius:50%; background:#b49eff1c; box-shadow:-410px 285px 0 80px #4dd0b324; filter:blur(2px); }
    .protagonist { position:absolute; z-index:2; left:50%; top:53%; width:150px; height:250px; transform:translate(-50%,-50%); display:flex; justify-content:center; align-items:flex-end; pointer-events:none; }
    .protagonist::before { content:""; position:absolute; left:50%; bottom:8px; width:142px; height:142px; transform:translateX(-50%); border-radius:50%; background:#71d3b72b; box-shadow:0 0 40px 20px #71d3b71c, inset 0 0 30px #efbc7216; }
    .protagonist img { position:relative; z-index:1; width:180px; height:240px; object-fit:contain; object-position:center bottom; filter:drop-shadow(0 16px 16px #00000072); }
    .protagonist-tag { position:absolute; z-index:3; bottom:-7px; left:50%; transform:translateX(-50%); white-space:nowrap; padding:5px 9px; border:1px solid #8be2ca; border-radius:999px; color:#e2fff6; background:#142d38e8; box-shadow:0 6px 14px #00000039; font-size:11px; font-weight:800; }
    .guide-mini-avatar { position:absolute; right:13px; bottom:-26px; z-index:1; width:110px; height:155px; display:grid; place-items:start center; padding-top:22px; color:#17223e; font-size:31px; font-weight:900; border-radius:52% 48% 22% 22%; background:linear-gradient(145deg,#a9d7ff,#81aefc); box-shadow:0 12px 20px #00000049; transform:rotate(4deg); }
    .guide-mini-avatar::before { content:""; position:absolute; top:14px; width:53px; height:39px; border-radius:50% 45% 42% 48%; background:#17223e; box-shadow:0 0 0 4px #17223e; }
    .guide-mini-avatar::after { content:"墨"; position:absolute; top:20px; z-index:2; color:#d9efff; font-size:19px; font-weight:900; }
    .route-lines { position:absolute; inset:0; width:100%; height:100%; overflow:visible; }
    .route { fill:none; stroke:#7691c177; stroke-width:2.3; stroke-dasharray:7 8; animation:dash 12s linear infinite; }
    .route.active { stroke:#e9cb8b; filter:drop-shadow(0 0 5px #f1c46a); }
    @keyframes dash { to { stroke-dashoffset:-120; } }
    .map-hint { position:absolute; left:18px; bottom:14px; color:#d8e3ffbf; font-size:11px; background:#07112677; border:1px solid #6680ae6b; padding:5px 8px; border-radius:999px; }
    .node {
      position:absolute; z-index:3; width:112px; min-height:78px; padding:8px; transform:translate(-50%, -50%); border-radius:15px; border:1px solid color-mix(in srgb, var(--node-color) 70%, #ffffff); color:#f4f7ff; text-align:left;
      background:linear-gradient(145deg, color-mix(in srgb, var(--node-color) 24%, #172746), #14203cdb); box-shadow:0 8px 20px #00000035; transition:transform .2s, filter .2s, opacity .2s, border-color .2s;
    }
    .node:hover:not(.locked) { transform:translate(-50%, -50%) translateY(-4px) scale(1.025); filter:brightness(1.12); }
    .node.locked { cursor:not-allowed; opacity:.43; border-style:dashed; filter:grayscale(.4); }
    .node.opened { box-shadow:0 0 0 3px color-mix(in srgb, var(--node-color) 24%, transparent), 0 10px 28px #00000049; }
    .node .icon { width:22px; height:22px; display:grid; place-items:center; color:#11172c; border-radius:7px; background:var(--node-color); font-size:14px; font-weight:900; margin-bottom:5px; }
    .node b { display:block; font-size:12px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .node span { display:block; color:#d6def6b8; font-size:10px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .node .node-action { margin-top:5px; color:#a8f1da; font-size:9px; letter-spacing:.04em; }
    .node .lock { position:absolute; top:8px; right:8px; color:#e2e9fc; font-size:12px; }
    .pulse { position:absolute; z-index:1; width:8px; height:8px; border-radius:50%; background:#c8d8ff; box-shadow:0 0 0 0 #b7ccff; animation:pulse 2.2s infinite; }
    @keyframes pulse { 70% { box-shadow:0 0 0 15px #b7ccff00; } 100% { box-shadow:0 0 0 0 #b7ccff00; } }
    .world-footer { padding:0 18px 17px; display:grid; grid-template-columns:1.2fr .8fr; gap:12px; }
    .status-card, .guide-card { border:1px solid #435579; border-radius:14px; padding:12px; background:#ffffff08; }
    .status-card b, .guide-card b { display:block; font-size:12px; color:#dfe7ff; }
    .status-card p, .guide-card p { margin:4px 0 0; color:#aab6d4; font-size:12px; }
    .progress-bar { display:flex; gap:5px; margin-top:10px; }
    .progress-bar i { width:24px; height:4px; display:block; background:#445374; border-radius:999px; }
    .progress-bar i.done { background:var(--teal); box-shadow:0 0 8px #71d3b788; }

    .task { padding:17px; position:sticky; top:14px; }
    .mission-title { margin:10px 0 7px; font-size:18px; line-height:1.35; }
    .task .brief { color:#bdc8e3; font-size:12px; margin:0; }
    .steps { margin:15px 0; padding:0; list-style:none; display:grid; gap:8px; }
    .step { display:flex; gap:8px; color:#97a4c8; font-size:12px; }
    .step i { width:18px; height:18px; flex:none; display:grid; place-items:center; border:1px solid #586a92; border-radius:50%; font-style:normal; font-size:10px; }
    .step.done { color:#d8f3e9; } .step.done i { color:#11261f; background:var(--teal); border-color:var(--teal); }
    .dialogue { border:1px solid #4d5f84; border-radius:15px; padding:12px; background:linear-gradient(145deg, #ffffff0e, #ffffff06); }
    .dialogue-top { display:flex; align-items:center; gap:8px; }
    .dialogue .pixel-avatar { width:31px; height:31px; font-size:16px; border-radius:9px 9px 4px 9px; }
    .dialogue .who { font-size:12px; font-weight:800; } .dialogue .role { font-size:10px; color:var(--muted); }
    .dialogue p { margin:8px 0 0; color:#d6def3; font-size:12px; }
    .guide-scene { min-height:196px; position:relative; overflow:hidden; margin:0 0 10px; border:1px solid #4d5f84; border-radius:16px; background:radial-gradient(circle at 80% 20%, #efbc7230, transparent 35%), linear-gradient(145deg, #24355d, #111a33); }
    .guide-scene::after { content:""; position:absolute; left:0; right:0; bottom:0; height:48px; background:linear-gradient(transparent, #0b1228b8); pointer-events:none; }
    .guide-scene img { position:absolute; z-index:1; right:-8px; bottom:-35px; width:205px; max-height:270px; object-fit:contain; object-position:center bottom; filter:drop-shadow(0 14px 17px #00000060); }
    .guide-copy { position:relative; z-index:2; width:58%; padding:14px 0 13px 14px; }
    .guide-copy .guide-label { color:#a4e4d0; font-size:10px; letter-spacing:.12em; text-transform:uppercase; font-weight:800; }
    .guide-copy b { display:block; margin-top:4px; font-size:15px; }
    .guide-copy p { margin:7px 0 0; color:#d2dcf5; font-size:12px; }
    .dialogue-compact { padding:10px; }
    .challenge { margin-top:14px; padding-top:14px; border-top:1px solid #415274; }
    .challenge h3 { font-size:13px; margin:0 0 6px; color:#ffd3d9; }
    .challenge p { color:#c0c9e3; font-size:12px; margin:0 0 9px; }
    .option { width:100%; border:1px solid #526381; border-radius:11px; padding:9px 10px; margin-top:7px; text-align:left; background:#ffffff07; color:#dce4fb; font-size:12px; transition:.16s; }
    .option:hover { border-color:#e9909c; background:#ed8b9816; } .option.selected { border-color:#ed8b98; background:#ed8b9824; }
    .challenge-response { margin-top:10px; padding:9px; border-left:3px solid var(--pink); background:#ed8b9810; color:#f1ccd1; border-radius:7px; font-size:12px; }
    .primary { width:100%; border:0; border-radius:11px; padding:10px; margin-top:12px; font-weight:800; color:#132236; background:linear-gradient(135deg, #a4d8ff, #71d3b7); box-shadow:0 6px 18px #71d3b733; }
    .primary:disabled { cursor:not-allowed; opacity:.4; filter:grayscale(1); }
    .chapter-nav { display:flex; gap:8px; align-items:center; margin-top:11px; }
    .chapter-nav .primary { margin-top:0; flex:1; }
    .secondary { border:1px solid #596b91; border-radius:10px; padding:8px 10px; color:#d9e4ff; background:#ffffff08; font-size:11px; }
    .secondary:hover { background:#ffffff14; }
    .page-lock { margin-top:10px; padding:8px 9px; border-radius:9px; color:#9ba9c9; background:#ffffff06; font-size:11px; }
    .notice { margin-top:14px; color:#aab5d0; font-size:11px; padding:9px; background:#ffffff08; border-radius:10px; }
    .loading, .error { min-height:60vh; display:grid; place-items:center; color:#c7d4f6; font-size:15px; }
    .error { color:#ffc7ce; text-align:center; padding:30px; }
    .completion { position:fixed; inset:0; z-index:20; display:none; padding:20px; align-items:center; justify-content:center; background:#060a17b8; backdrop-filter:blur(8px); }
    .completion.show { display:flex; }
    .completion-card { max-width:570px; width:100%; max-height:90vh; overflow:auto; padding:24px; border:1px solid #6c81ad; border-radius:24px; background:linear-gradient(145deg, #1c2b50, #111a31); box-shadow:0 30px 90px #00000080; }
    .seal { width:48px; height:48px; display:grid; place-items:center; color:#172741; background:var(--gold); border-radius:15px; font-size:24px; }
    .completion h2 { margin:12px 0 4px; font-size:24px; }
    .completion p { color:#c3cde7; }
    .completion textarea { width:100%; min-height:80px; padding:10px; color:#e5edff; background:#07102188; border:1px solid #536688; border-radius:12px; resize:vertical; outline:none; }
    .completion textarea:focus { border-color:var(--teal); box-shadow:0 0 0 3px #71d3b722; }
    .questions { margin:14px 0; padding-left:19px; color:#c7d3ef; } .questions li { margin:7px 0; }
    .completion-actions { display:flex; gap:9px; margin-top:16px; }
    .completion-actions a, .completion-actions button { flex:1; border-radius:11px; padding:10px; text-align:center; font-weight:800; }
    .completion-actions a { background:#ffffff0e; border:1px solid #596b91; color:#dce6ff; }
    .completion-actions button { color:#11243d; border:0; background:var(--teal); }
    .scene-modal { position:fixed; inset:0; z-index:30; display:none; align-items:center; justify-content:center; padding:18px; background:#050916d9; backdrop-filter:blur(9px); }
    .scene-modal.show { display:flex; }
    .scene-card { width:min(980px,100%); max-height:94vh; overflow:auto; border:1px solid #6b80ac; border-radius:24px; background:linear-gradient(145deg,#1d2d52,#10182e); box-shadow:0 30px 100px #00000099; animation:chapterIn .28s ease both; }
    .scene-head { display:flex; justify-content:space-between; gap:16px; align-items:flex-start; padding:20px 22px 10px; }
    .scene-head h2 { margin:3px 0 0; font-size:25px; }
    .scene-head p { margin:4px 0 0; color:#aebbd8; font-size:12px; }
    .scene-close { border:1px solid #5a6c93; border-radius:10px; color:#cad6f1; background:#ffffff08; padding:7px 10px; }
    .scene-close:hover { background:#ffffff15; }
    .scene-stage { display:grid; grid-template-columns:190px 1fr; gap:18px; align-items:stretch; padding:0 22px 18px; }
    .scene-hero { min-height:270px; position:relative; display:flex; align-items:flex-end; justify-content:center; overflow:hidden; border:1px solid #43577f; border-radius:18px; background:radial-gradient(circle at 50% 25%,#71d3b72d,transparent 46%),linear-gradient(160deg,#162746,#111a32); }
    .scene-hero::after { content:""; position:absolute; left:12%; right:12%; bottom:12px; height:42px; border-radius:50%; background:#71d3b72a; filter:blur(5px); }
    .scene-hero img { position:relative; z-index:1; width:180px; height:260px; object-fit:contain; object-position:center bottom; filter:drop-shadow(0 14px 15px #00000066); }
    .scene-hero-tag { position:absolute; z-index:2; bottom:9px; left:50%; transform:translateX(-50%); padding:4px 9px; border:1px solid #8be2ca; border-radius:99px; white-space:nowrap; color:#e6fff8; background:#102a35df; font-size:10px; font-weight:800; }
    .scene-content { min-width:0; }
    .scene-intro { padding:12px 14px; border:1px solid #4b5f88; border-radius:15px; color:#d5def4; background:#ffffff08; font-size:13px; }
    .scene-intro strong { display:block; margin-bottom:4px; color:#f3d18f; font-size:11px; letter-spacing:.08em; }
    .scene-objects { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:11px; }
    .scene-object { min-height:112px; border:1px solid #4c6088; border-radius:13px; padding:10px; text-align:left; color:#dce5fb; background:#ffffff07; transition:.18s ease; }
    .scene-object:hover { border-color:#9ab7ef; transform:translateY(-2px); background:#ffffff11; }
    .scene-object.discovered { border-color:var(--teal); background:#71d3b714; box-shadow:0 0 0 2px #71d3b70e; }
    .scene-object b { display:block; font-size:12px; }
    .scene-object small { display:block; margin-top:3px; color:#94a3c8; font-size:10px; }
    .scene-object p { margin:8px 0 0; color:#c9d5ef; font-size:11px; line-height:1.5; }
    .scene-progress { margin-top:9px; color:#93a3c9; font-size:11px; }
    .scene-question { margin-top:13px; padding:13px; border:1px solid #596b95; border-radius:15px; background:linear-gradient(145deg,#ffffff0d,#ffffff05); }
    .scene-question h3 { margin:0 0 8px; color:#e6edff; font-size:14px; }
    .scene-answers { display:grid; gap:7px; }
    .scene-answer { border:1px solid #53668e; border-radius:10px; padding:9px 10px; text-align:left; color:#dce6fb; background:#ffffff07; font-size:12px; }
    .scene-answer:hover:not(:disabled), .scene-answer.selected { border-color:#efbc72; background:#efbc7217; }
    .scene-answer:disabled { cursor:not-allowed; opacity:.4; }
    .scene-feedback { margin-top:10px; padding:10px; border-left:3px solid var(--gold); border-radius:7px; color:#f0dfb8; background:#efbc7212; font-size:12px; }
    .scene-bottom { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-top:12px; }
    .scene-takeaway { flex:1; color:#9eacd0; font-size:11px; }
    .scene-complete { border:0; border-radius:10px; padding:9px 12px; color:#14233d; background:var(--teal); font-weight:800; }
    .scene-complete:disabled { cursor:not-allowed; opacity:.4; filter:grayscale(1); }
    @media (max-width:1180px) { .layout { grid-template-columns:230px minmax(430px,1fr); } .task { grid-column:2; position:static; } .world-panel { min-height:auto; } }
    @media (max-width:820px) { .app { padding:15px 12px 30px; } .topbar { align-items:flex-start; } .top-actions { justify-content:flex-start; } .layout { grid-template-columns:1fr; } .crew, .task { position:static; } .world-panel { order:-1; } .world-footer { grid-template-columns:1fr; } .map { height:430px; } .node { width:100px; } .scene-stage { grid-template-columns:150px 1fr; gap:12px; } .scene-hero { min-height:240px; } .scene-hero img { width:145px; height:225px; } }
    @media (max-width:520px) { .topbar { display:block; } .top-actions { margin-top:12px; } .world-head { display:block; } .snapshot { text-align:left; padding-left:0; } .chapter-intro { padding-left:14px; padding-right:14px; } .chapter-number { font-size:32px; } .map { height:390px; margin:12px 8px; } .node { width:82px; min-height:70px; padding:7px; } .node b { font-size:10px; } .node span { font-size:9px; } .world-footer { padding:0 12px 13px; } .guide-copy { width:67%; padding-left:11px; } .guide-copy p { font-size:11px; } .guide-mini-avatar { right:-10px; } .protagonist { transform:translate(-50%,-50%) scale(.78); } .protagonist-tag { font-size:10px; } .player-card { margin-top:10px; } .scene-modal { padding:8px; } .scene-head { padding:14px 14px 8px; } .scene-head h2 { font-size:20px; } .scene-stage { display:block; padding:0 14px 14px; } .scene-hero { min-height:150px; margin-bottom:10px; } .scene-hero img { width:118px; height:170px; } .scene-object { min-height:96px; padding:8px; } .scene-object p { font-size:10px; } .scene-bottom { display:block; } .scene-complete { width:100%; margin-top:8px; } }
  </style>
</head>
<body>
  <div class="app" id="app"><div class="loading">正在打开产业链世界…</div></div>
  <div class="completion" id="completion"></div>
  <div class="scene-modal" id="sceneModal"></div>
  <script>
    const app = document.getElementById('app');
    const completion = document.getElementById('completion');
    const sceneModal = document.getElementById('sceneModal');
    const query = new URLSearchParams(location.search);
    const code = query.get('code') || '300750';
    const savedKey = `jiheng-world-${code}`;
    let savedSession = {};
    try { savedSession = JSON.parse(sessionStorage.getItem(savedKey) || '{}') || {}; } catch (_) { savedSession = {}; }
    const requestedChapter = Number(query.get('chapter'));
    const savedChapter = Number(savedSession.chapter);
    const state = {
      scenario: null,
      opened: new Set(Array.isArray(savedSession.opened) ? savedSession.opened : []),
      selectedNode: null,
      dialogue: null,
      hardOnly: false,
      answer: savedSession.answer || null,
      completed: false,
      chapter: Number.isFinite(requestedChapter) ? Math.max(0, Math.floor(requestedChapter)) : (Number.isFinite(savedChapter) ? Math.max(0, Math.floor(savedChapter)) : 0),
      scene: null,
      sceneEvidence: new Set(),
      sceneAnswer: null,
    };
    const esc = (value) => String(value ?? '').replace(/[&<>'"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
    const byId = (id) => state.scenario.nodes.find(node => node.id === id);
    const agent = (id) => state.scenario.agents.find(item => item.id === id);
    const openedCount = () => state.opened.size;
    const isUnlocked = (node) => node.initially_unlocked || state.opened.has(node.id) || node.unlock_after.every(id => state.opened.has(id));
    const isOpened = (id) => state.opened.has(id);
    const evidence = () => state.scenario.nodes.filter(node => state.opened.has(node.id)).map(node => node.clue);
    const currentChapter = () => state.scenario.chapters[state.chapter];
    const chapterNodes = (chapter = currentChapter()) => chapter.node_ids.map(byId).filter(Boolean);
    const chapterComplete = (chapter = currentChapter()) => chapter.node_ids.every(id => state.opened.has(id));
    const allNodesOpened = () => state.scenario.nodes.every(node => state.opened.has(node.id));
    const chapterAccessible = (index) => index === 0 || state.scenario.chapters.slice(0, index).every(chapter => chapterComplete(chapter));
    const maxAccessibleChapter = () => {
      let max = 0;
      for (let index = 1; index < state.scenario.chapters.length; index += 1) {
        if (!chapterComplete(state.scenario.chapters[index - 1])) break;
        max = index;
      }
      return max;
    };
    const persist = () => sessionStorage.setItem(savedKey, JSON.stringify({ opened: [...state.opened], chapter: state.chapter, answer: state.answer }));

    function setDialogue(agentId, text) {
      state.dialogue = { agentId, text };
    }

    function render() {
      const s = state.scenario;
      const chapter = currentChapter();
      const dialogue = state.dialogue || { agentId: 'archivist', text: s.agents[0].intro };
      const speaking = agent(dialogue.agentId) || s.agents[0];
      const progress = openedCount();
      const pageDone = chapterComplete(chapter);
      app.innerHTML = `
        <header class="topbar">
          <a class="brand" href="/"><div class="mark">玑</div><div><h1>玑衡 World</h1><div class="subtitle">产业链调查游戏 · 研究模式的第二现场</div></div></a>
          <div class="top-actions"><span class="tag live">● 演示世界</span><span class="tag">${esc(s.as_of)}</span><a class="ghost-link" href="/">返回研究台</a></div>
        </header>
        <main class="layout">
          <aside class="panel crew">
            <div class="eyebrow">Player Profile</div><h2>你的调查档案</h2><div class="small">你是这次探索的主人公。</div>
            <div class="player-card"><div class="player-avatar">你</div><div><b>产业链探索者</b><span>新手调查员 · Lv.1</span><em>点击节点，亲手点亮一家公司</em></div></div>
            <div class="eyebrow">Companions</div><h2>同行角色</h2><div class="small">他们提供提示和反驳，但结论由你拼出来。</div>
            <div class="agents">${s.agents.map(item => {
              const active = item.id === dialogue.agentId || s.nodes.some(node => node.agent_id === item.id && state.opened.has(node.id));
              const status = active && item.id !== 'risk' ? '线索已更新' : item.status;
              return `<div class="agent-card ${active ? 'active' : ''}" style="--agent-color:${item.color}"><div class="pixel-avatar">${esc(item.glyph)}</div><div><b>${esc(item.name)} · ${esc(item.title)}</b><span>${esc(status)}</span></div><i class="agent-state"></i></div>`;
            }).join('')}</div>
            <section class="ledger">
              <div class="ledger-head"><div><div class="eyebrow">Evidence bag</div><b>线索背包 · ${evidence().length}</b></div><label class="toggle"><input id="hardToggle" type="checkbox" ${state.hardOnly ? 'checked' : ''}>只看硬数据</label></div>
              <ul class="clue-list">${renderClues()}</ul>
            </section>
          </aside>
          <section class="panel world-panel">
            <div class="world-head"><div><div class="eyebrow">Company world / ${esc(s.code)}</div><h2>${esc(chapter.title)}</h2><p>${esc(s.world_name)} · ${esc(chapter.subtitle)}</p></div><div class="snapshot">${esc(s.notice)}</div></div>
            <div class="chapter-strip">${s.chapters.map((item, index) => { const done = chapterComplete(item); const accessible = chapterAccessible(index); return `<button class="chapter-tab ${index === state.chapter ? 'current' : ''} ${done ? 'done' : ''} ${accessible ? '' : 'locked'}" data-chapter="${index}" ${accessible ? '' : 'disabled'}><small>${esc(item.number)} · ${esc(item.eyebrow)}</small><b>${esc(item.title)}</b></button>`; }).join('')}</div>
            <div class="chapter-page">
              <div class="chapter-intro"><div><div class="eyebrow">${esc(chapter.eyebrow)}</div><h3>${esc(chapter.brief)}</h3><p>你正在调查这一段链路。点击节点，亲手把它点亮。</p></div><div class="chapter-number">${esc(chapter.number)}</div></div>
              <div class="map">
                <svg class="route-lines" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">${renderRoutes()}</svg>
                <div class="protagonist"><img src="/static/assets/guide-mo.png" alt="你，产业链探索者" /><div class="protagonist-tag">你 · 产业链探索者</div></div>
                ${chapterNodes().map(renderNode).join('')}
                <div class="map-hint">由你点击节点，点亮 ${esc(chapter.eyebrow)} 线索</div>
              </div>
              <div class="world-footer">
                <div class="status-card"><b>你的点亮进度 · ${progress}/${s.nodes.length}</b><p>${pageDone ? (state.chapter < s.chapters.length - 1 ? '这一页已经被你点亮，可以切换到下一条链路。' : '四条链路全部被你点亮，风险猎人正在等待你的答案。') : '继续点击本页节点。每个节点都会交出一条带来源标签的证据。'}</p><div class="progress-bar">${s.nodes.map(node => `<i class="${isOpened(node.id) ? 'done':''}"></i>`).join('')}</div>${renderChapterNav()}</div>
                <div class="guide-card"><b>这不是股价预测</b><p>游戏目标是建立可检验的因果链；专业页保留完整来源与多空论证。</p></div>
              </div>
            </div>
          </section>
          <aside class="panel task">
            <div class="eyebrow">Current mission</div><div class="mission-title">${esc(s.mission.title)}</div><p class="brief">${esc(s.mission.brief)}</p>
            <ul class="steps">${s.chapters.map((item, index) => `<li class="step ${chapterComplete(item) ? 'done' : ''} ${index === state.chapter ? 'current' : ''}"><i>${chapterComplete(item) ? '✓' : item.number}</i><span>${esc(item.eyebrow)}：${esc(item.title)}</span></li>`).join('')}</ul>
            <section class="guide-scene"><div class="guide-mini-avatar" aria-hidden="true"></div><div class="guide-copy"><span class="guide-label">同行向导 · 不是主角</span><b>墨 · 档案官</b><p>${esc(chapter.guide)}</p></div></section>
            <section class="dialogue dialogue-compact"><div class="dialogue-top"><div class="pixel-avatar" style="--agent-color:${speaking.color}">${esc(speaking.glyph)}</div><div><div class="who">${esc(speaking.name)} · ${esc(speaking.title)}</div><div class="role">实时调查记录</div></div></div><p>${esc(dialogue.text)}</p></section>
            ${renderChallenge()}
            <div class="notice">${esc(s.notice)}</div>
          </aside>
        </main>`;
      document.getElementById('hardToggle').addEventListener('change', event => { state.hardOnly = event.target.checked; render(); });
      document.querySelectorAll('[data-node]').forEach(button => button.addEventListener('click', () => openScene(button.dataset.node)));
      document.querySelectorAll('[data-answer]').forEach(button => button.addEventListener('click', () => answer(button.dataset.answer)));
      document.querySelectorAll('[data-chapter]').forEach(button => button.addEventListener('click', () => goChapter(Number(button.dataset.chapter))));
      const nextButton = document.querySelector('[data-next]');
      if (nextButton) nextButton.addEventListener('click', () => goChapter(state.chapter + 1));
      const previousButton = document.querySelector('[data-previous]');
      if (previousButton) previousButton.addEventListener('click', () => goChapter(state.chapter - 1));
      const closeButton = document.querySelector('[data-complete]');
      if (closeButton) closeButton.addEventListener('click', finish);
      renderSceneModal();
    }

    function renderSceneModal() {
      if (!state.scene) {
        sceneModal.classList.remove('show');
        sceneModal.innerHTML = '';
        return;
      }
      const node = byId(state.scene);
      const scene = node && node.scene;
      if (!node || !scene) {
        state.scene = null;
        sceneModal.classList.remove('show');
        sceneModal.innerHTML = '';
        return;
      }
      const investigated = state.sceneEvidence.size === scene.objects.length;
      const selected = scene.answers.find(option => option.id === state.sceneAnswer);
      sceneModal.innerHTML = `<section class="scene-card" role="dialog" aria-modal="true" aria-label="${esc(scene.title)}场景">
        <header class="scene-head"><div><div class="eyebrow">${esc(scene.eyebrow)}</div><h2>${esc(scene.title)}</h2><p>你正在现场调查。完成后返回地图，点亮这个产业链节点。</p></div><button class="scene-close" data-scene-close>暂时离开</button></header>
        <div class="scene-stage">
          <div class="scene-hero"><img src="/static/assets/guide-mo.png" alt="你，产业链探索者" /><div class="scene-hero-tag">你 · 正在调查</div></div>
          <div class="scene-content">
            <div class="scene-intro"><strong>现场引子</strong>${esc(scene.intro)}</div>
            <div class="scene-objects">${scene.objects.map(object => { const discovered = state.sceneEvidence.has(object.id); return `<button class="scene-object ${discovered ? 'discovered' : ''}" data-scene-object="${esc(object.id)}"><b>${discovered ? '✓ ' : ''}${esc(object.label)}</b><small>${esc(object.caption)}</small><p>${discovered ? esc(object.detail) : '点击调查这个现场物件'}</p></button>`; }).join('')}</div>
            <div class="scene-progress">现场线索：${state.sceneEvidence.size}/${scene.objects.length} · ${investigated ? '可以回答问题了' : '先调查完所有物件'}</div>
            <section class="scene-question"><h3>${esc(scene.prompt)}</h3><div class="scene-answers">${scene.answers.map(option => `<button class="scene-answer ${state.sceneAnswer === option.id ? 'selected' : ''}" data-scene-answer="${esc(option.id)}" ${investigated ? '' : 'disabled'}>${esc(option.label)}</button>`).join('')}</div>${selected ? `<div class="scene-feedback">${esc(selected.feedback)}</div>` : ''}<div class="scene-bottom"><div class="scene-takeaway">${selected ? '你的判断已经有反馈。完成调查后，这条链路会回到地图上。' : '先收集现场线索，再选择你认为最合理的解释。'}</div><button class="scene-complete" data-scene-complete ${selected ? '' : 'disabled'}>完成调查并点亮节点</button></div></section>
          </div>
        </div>
      </section>`;
      sceneModal.classList.add('show');
      sceneModal.querySelector('[data-scene-close]').addEventListener('click', closeScene);
      sceneModal.querySelectorAll('[data-scene-object]').forEach(button => button.addEventListener('click', () => investigateSceneObject(button.dataset.sceneObject)));
      sceneModal.querySelectorAll('[data-scene-answer]').forEach(button => button.addEventListener('click', () => chooseSceneAnswer(button.dataset.sceneAnswer)));
      const completeButton = sceneModal.querySelector('[data-scene-complete]');
      if (completeButton) completeButton.addEventListener('click', completeScene);
    }

    function renderClues() {
      const clues = evidence().filter(clue => !state.hardOnly || clue.kind === 'hard');
      if (!clues.length) return `<li class="no-clues">${state.hardOnly && evidence().length ? '目前没有已解锁的硬数据线索。' : '尚未收集线索。先从盐湖矿区开始。'}</li>`;
      return clues.map(clue => `<li class="clue ${clue.kind}"><b>${esc(clue.id)} · ${esc(clue.title)}</b><span class="source">${clue.kind === 'hard' ? '硬数据' : 'AI 推断'} · ${esc(clue.source)}</span></li>`).join('');
    }

    function renderChapterNav() {
      const s = state.scenario;
      const previous = state.chapter > 0 ? '<button class="secondary" data-previous>← 上一页</button>' : '';
      if (!chapterComplete()) return `${previous}<div class="page-lock">收齐本页线索后，下一条链路会亮起。</div>`;
      if (state.chapter < s.chapters.length - 1) {
        const next = s.chapters[state.chapter + 1];
        return `<div class="chapter-nav">${previous}<button class="primary" data-next>进入 ${esc(next.eyebrow)} →</button></div>`;
      }
      return `${previous}${allNodesOpened() ? '<div class="page-lock">四条链路已完成，回答右侧的风险挑战。</div>' : ''}`;
    }

    function renderRoutes() {
      const ids = currentChapter().node_ids;
      const position = (id) => {
        const index = ids.indexOf(id);
        return ids.length === 1 ? { x: 80, y: 48 } : (index === 0 ? { x: 19, y: 31 } : { x: 81, y: 69 });
      };
      const center = { x: 50, y: 55 };
      return ids.map(id => {
        const node = byId(id), target = position(id);
        const active = state.opened.has(id) || isUnlocked(node);
        return `<line class="route ${active ? 'active' : ''}" x1="${center.x}" y1="${center.y}" x2="${target.x}" y2="${target.y}" />`;
      }).join('');
    }

    function renderNode(node) {
      const unlocked = isUnlocked(node), opened = isOpened(node.id);
      const icon = opened ? '✓' : unlocked ? '⌁' : '⌕';
      const ids = currentChapter().node_ids;
      const index = ids.indexOf(node.id);
      const x = ids.length === 1 ? 80 : (index === 0 ? 19 : 81);
      const y = ids.length === 1 ? 48 : (index === 0 ? 31 : 69);
      return `<button class="node ${unlocked ? '' : 'locked'} ${opened ? 'opened' : ''}" style="left:${x}%;top:${y}%;--node-color:${node.color}" data-node="${node.id}" ${unlocked ? '' : 'aria-disabled="true"'}><span class="icon">${icon}</span><b>${esc(node.label)}</b><span>${esc(node.caption)}</span>${unlocked ? `<span class="node-action">${opened ? '重新进入现场' : '进入现场调查'}</span>` : '<i class="lock">⌑</i>'}</button>`;
    }

    function renderChallenge() {
      const s = state.scenario;
      if (!allNodesOpened()) return '';
      const selected = s.risk_challenge.options.find(option => option.id === state.answer);
      return `<section class="challenge"><h3>${esc(s.risk_challenge.title)}</h3><p>${esc(s.risk_challenge.prompt)}</p>${s.risk_challenge.options.map(option => `<button class="option ${state.answer === option.id ? 'selected' : ''}" data-answer="${option.id}">${esc(option.label)}</button>`).join('')}${selected ? `<div class="challenge-response">${esc(selected.response)}</div><button class="primary" data-complete>生成理解卡</button>` : ''}</section>`;
    }

    function openScene(id) {
      const node = byId(id);
      if (!node) return;
      if (!isUnlocked(node)) {
        const missing = node.unlock_after.find(item => !state.opened.has(item));
        const target = byId(missing);
        setDialogue('archivist', `这条通道还没有打开。请先完成「${target ? target.label : '上一条线索'}」的调查。`);
        render();
        return;
      }
      state.scene = id;
      state.sceneEvidence = new Set();
      state.sceneAnswer = null;
      render();
    }

    function closeScene() {
      state.scene = null;
      state.sceneEvidence = new Set();
      state.sceneAnswer = null;
      render();
    }

    function investigateSceneObject(objectId) {
      if (!state.scene) return;
      const node = byId(state.scene);
      if (!node || !node.scene.objects.some(object => object.id === objectId)) return;
      state.sceneEvidence.add(objectId);
      renderSceneModal();
    }

    function chooseSceneAnswer(answerId) {
      if (!state.scene) return;
      const node = byId(state.scene);
      const scene = node && node.scene;
      if (!scene || state.sceneEvidence.size !== scene.objects.length) return;
      if (!scene.answers.some(option => option.id === answerId)) return;
      state.sceneAnswer = answerId;
      renderSceneModal();
    }

    function completeScene() {
      if (!state.scene) return;
      const node = byId(state.scene);
      const scene = node && node.scene;
      if (!node || !scene || !state.sceneAnswer || state.sceneEvidence.size !== scene.objects.length) return;
      state.opened.add(node.id);
      state.selectedNode = node.id;
      setDialogue(node.agent_id, `你完成了「${node.label}」的调查。${scene.takeaway}`);
      state.scene = null;
      state.sceneEvidence = new Set();
      state.sceneAnswer = null;
      persist();
      render();
    }

    function answer(id) {
      const option = state.scenario.risk_challenge.options.find(item => item.id === id);
      if (!option) return;
      state.answer = id;
      setDialogue('risk', option.response);
      persist();
      render();
    }

    function goChapter(index) {
      if (!state.scenario || index < 0 || index >= state.scenario.chapters.length) return;
      if (index > state.chapter && !chapterComplete()) {
        setDialogue('archivist', '这一页还有线索没有收齐。先完成当前链路，再继续向前。');
        render();
        return;
      }
      if (!chapterAccessible(index)) {
        setDialogue('archivist', '前面的链路还没有完成，现在还不能跳过去。');
        render();
        return;
      }
      state.chapter = index;
      state.dialogue = { agentId: 'archivist', text: currentChapter().guide };
      persist();
      history.pushState({}, '', `/world?code=${encodeURIComponent(code)}&chapter=${index}`);
      render();
    }

    function finish() {
      const s = state.scenario;
      state.completed = true;
      const selected = s.risk_challenge.options.find(option => option.id === state.answer);
      completion.innerHTML = `<section class="completion-card"><div class="seal">✦</div><div class="eyebrow" style="margin-top:12px">Investigation complete</div><h2>${esc(s.completion.title)}</h2><p>${esc(s.completion.summary)}</p><div class="dialogue" style="margin-top:14px"><div class="dialogue-top"><div class="pixel-avatar" style="--agent-color:#ed8b98">✦</div><div><div class="who">赤 · 风险猎人</div><div class="role">你的回答：${esc(selected.label)}</div></div></div><p>${esc(selected.response)}</p></div><h3>下一轮应该追问什么？</h3><ul class="questions">${s.completion.next_questions.map(question => `<li>${esc(question)}</li>`).join('')}</ul><label class="small" for="note">写下你的理解（本地演示，不会上传）</label><textarea id="note" placeholder="例如：成本上涨未必立刻压缩利润，因为……"></textarea><div class="completion-actions"><a href="/">回到专业研究台</a><button id="closeCompletion">继续探索地图</button></div></section>`;
      completion.classList.add('show');
      document.getElementById('closeCompletion').addEventListener('click', () => completion.classList.remove('show'));
    }

    async function boot() {
      try {
        const response = await fetch(`/api/world/${encodeURIComponent(code)}`);
        const data = await response.json();
        if (!response.ok) throw new Error(data.detail || '世界档案无法读取');
        if (!data.available) {
          app.innerHTML = `<div class="error"><div><h2>这个世界暂未开放</h2><p>${esc(data.message)}</p><a class="ghost-link" href="/">回到研究台</a></div></div>`;
          return;
        }
        state.scenario = data;
        state.opened = new Set([...state.opened].filter(id => data.nodes.some(node => node.id === id)));
        state.chapter = Math.min(state.chapter, maxAccessibleChapter());
        state.dialogue = { agentId: 'archivist', text: data.agents.find(item => item.id === 'archivist').intro };
        persist();
        render();
      } catch (error) {
        app.innerHTML = `<div class="error"><div><h2>产业链世界暂时失联</h2><p>${esc(error.message)}</p><a class="ghost-link" href="/">回到研究台</a></div></div>`;
      }
    }
    window.addEventListener('popstate', () => {
      if (!state.scenario) return;
      const requested = Number(new URLSearchParams(location.search).get('chapter'));
      const next = Number.isFinite(requested) ? Math.max(0, Math.min(Math.floor(requested), maxAccessibleChapter())) : 0;
      state.chapter = next;
      state.dialogue = { agentId: 'archivist', text: currentChapter().guide };
      persist();
      render();
    });
    boot();
  </script>
</body>
</html>
