<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>玑衡 World · 产业链走访</title>
<style>
  :root{color-scheme:dark;--ink:#f7f1e5;--muted:#b8c7c6;--soft:#809393;--gold:#f3c884;--teal:#9dd8d0;--line:rgba(255,240,211,.23);--dark:#09131b;--card:rgba(10,23,30,.88)}
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;font-family:Inter,"Microsoft YaHei","PingFang SC",system-ui,sans-serif;background:var(--dark);color:var(--ink)}
  button,input{font:inherit} button{cursor:pointer} button:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
  .hidden{display:none!important}
  .world{position:relative;height:100dvh;min-height:600px;overflow:hidden;isolation:isolate;background:#101b20}
  .scene-bg{position:absolute;inset:-2%;background-position:center;background-size:cover;transition:transform .75s ease,filter .75s ease;transform:scale(1.04);z-index:-3}
  .scene-bg.crop{background-position:right center;background-size:135% auto}
  .scene-bg.storage{background-position:78% 38%;background-size:160% auto;filter:hue-rotate(22deg) saturate(.75) brightness(.8)}
  .scene-shade{position:absolute;inset:0;z-index:-2;background:linear-gradient(90deg,rgba(3,11,16,.75),rgba(3,11,16,.22) 42%,rgba(4,11,14,.04) 72%),linear-gradient(0deg,rgba(3,11,16,.8),rgba(3,11,16,.10) 58%,rgba(3,11,16,.43));pointer-events:none}
  .world.entering .scene-bg{animation:scene-in .82s cubic-bezier(.15,.68,.28,1) both}
  .world.entering .scene-shade{animation:shade-in .82s ease both}
  @keyframes scene-in{from{opacity:.3;transform:translateX(7%) scale(1.12);filter:blur(6px)}to{opacity:1;transform:translateX(0) scale(1.04);filter:blur(0)}}
  @keyframes shade-in{from{opacity:.1}to{opacity:1}}
  .topbar{position:absolute;z-index:5;left:0;right:0;top:0;display:flex;align-items:center;gap:16px;padding:18px clamp(20px,3.4vw,52px);background:linear-gradient(180deg,rgba(5,14,19,.75),transparent)}
  .brand{display:flex;align-items:center;gap:11px;font-weight:900;letter-spacing:.08em;white-space:nowrap;font-size:18px;text-shadow:0 2px 15px #000}
  .brand-mark{position:relative;display:block;flex:none;width:42px;height:42px;overflow:hidden;border-radius:50%;border:1px solid rgba(255,211,120,.8);background:#082047;box-shadow:0 0 17px rgba(236,177,75,.28)}
  .brand-mark img{position:absolute;max-width:none;width:147%;height:147%;left:-24%;top:-18%}
  .brand small{display:block;font-size:10px;font-weight:700;letter-spacing:.22em;color:var(--gold);line-height:1.15}
  .case{margin-left:20px;padding-left:20px;border-left:1px solid var(--line);font-size:12px;color:#d9e2df;line-height:1.5}
  .case b{display:block;font-size:13px;color:#fff;letter-spacing:.05em}
  .spacer{flex:1}
  .top-note{padding:7px 11px;background:rgba(8,24,29,.56);border:1px solid var(--line);border-radius:999px;color:#f1dbc0;font-size:11px;white-space:nowrap;backdrop-filter:blur(8px)}
  .top-action{border:1px solid var(--line);background:rgba(8,23,29,.65);color:var(--ink);border-radius:12px;padding:8px 13px;font-size:12px;font-weight:800;backdrop-filter:blur(10px)}
  .top-action:hover,.tool:hover{background:rgba(22,52,57,.9);border-color:var(--gold)}
  .scene-copy{position:absolute;left:clamp(24px,5vw,82px);top:clamp(105px,14vh,170px);max-width:min(520px,52vw);text-shadow:0 3px 22px rgba(0,0,0,.75);pointer-events:none}
  .eyebrow{color:var(--gold);font-size:12px;font-weight:850;letter-spacing:.22em;text-transform:uppercase}
  .scene-copy h1{font-family:"Songti SC","Noto Serif CJK SC",serif;font-size:clamp(36px,5.5vw,76px);line-height:1.1;margin:12px 0 13px;letter-spacing:.03em}
  .scene-copy p{margin:0;max-width:440px;color:#e5e9e4;font-size:clamp(13px,1.15vw,16px);line-height:1.75}
  .ambient-line{display:inline-flex;gap:7px;align-items:center;color:#c8d7d2;margin-top:22px;font-size:11px;letter-spacing:.1em}
  .ambient-line:before{content:"";display:block;width:26px;border-top:1px solid var(--gold)}
  .npc-portrait{position:absolute;right:7vw;bottom:19vh;height:75vh;max-height:850px;width:min(42vw,600px);object-fit:contain;object-position:bottom center;mix-blend-mode:screen;filter:drop-shadow(0 20px 40px rgba(0,0,0,.75));mask-image:linear-gradient(90deg,transparent 0%,#000 18%,#000 82%,transparent 100%);pointer-events:none}
  .npc-presence{position:absolute;right:clamp(35px,7vw,110px);top:24vh;width:210px;padding:12px 16px;border:1px solid rgba(255,230,185,.45);border-radius:13px;background:rgba(5,17,23,.55);box-shadow:0 18px 40px #0005;backdrop-filter:blur(9px);text-align:center}
  .npc-presence .pulse{height:9px;width:9px;margin:0 auto 10px;background:var(--teal);border-radius:50%;box-shadow:0 0 0 7px rgba(157,216,208,.15),0 0 24px var(--teal)}
  .npc-presence b{display:block;font-size:18px;letter-spacing:.12em}.npc-presence span{font-size:11px;color:var(--muted)}
  .toolbelt{position:absolute;z-index:7;left:clamp(15px,3vw,42px);bottom:calc(min(350px,45dvh) + 32px);display:flex;gap:9px}
  .tool{min-width:70px;border:1px solid rgba(246,224,183,.4);border-radius:14px;background:rgba(8,23,29,.73);color:var(--ink);padding:7px 11px;text-align:center;box-shadow:0 12px 25px #0006;backdrop-filter:blur(12px)}
  .tool .ico{display:block;font-size:21px;line-height:1.15}.tool span:last-child{display:block;font-size:10px;font-weight:700;letter-spacing:.13em}
  .tool .count{position:absolute;margin:-42px 0 0 51px;background:#c7844b;color:#160f0a;border-radius:50%;font-size:9px;line-height:17px;width:17px;height:17px}
  .dialogue{position:absolute;z-index:6;left:clamp(15px,3vw,42px);right:clamp(15px,3vw,42px);bottom:18px;height:min(350px,45dvh);border:1px solid rgba(247,221,180,.45);border-radius:20px 20px 13px 13px;background:linear-gradient(120deg,rgba(8,25,32,.95),rgba(11,27,34,.9));box-shadow:0 22px 70px rgba(0,0,0,.58),inset 0 1px 0 rgba(255,255,255,.12);backdrop-filter:blur(20px);display:flex;flex-direction:column;overflow:hidden}
  .dialogue:before{content:"";position:absolute;left:26px;right:26px;top:0;border-top:2px solid rgba(243,200,132,.54)}
  .dialogue-head{display:flex;align-items:center;gap:12px;padding:13px 22px 8px;min-height:60px;border-bottom:1px solid rgba(255,255,255,.09)}
  .speaker-icon{height:37px;width:37px;border:1px solid var(--gold);border-radius:12px;display:grid;place-items:center;color:var(--gold);font-family:serif;font-size:21px;background:rgba(243,200,132,.1)}
  .speaker b{display:block;font-size:15px;letter-spacing:.06em}.speaker small{display:block;font-size:10px;letter-spacing:.09em;color:var(--muted)}
  .mood{margin-left:auto;color:var(--teal);font-size:11px;white-space:nowrap}.mood:before{content:"●";padding-right:6px;font-size:8px}
  .head-btn{border:0;background:transparent;color:var(--muted);font-size:11px;text-decoration:underline;text-underline-offset:4px;padding:6px}
  .dialogue-main{display:grid;grid-template-columns:160px 1fr;gap:18px;min-height:0;flex:1;padding:14px 22px 5px}
  .speaker-side{font-size:11px;line-height:1.7;color:var(--muted);padding:4px 12px 0 0;border-right:1px solid var(--line)}
  .speaker-side b{display:block;color:var(--gold);font-size:10px;letter-spacing:.16em;margin-bottom:8px}
  .speech-area{overflow:auto;scrollbar-width:thin;display:flex;flex-direction:column;gap:7px;padding-right:8px}
  .speech-area .said-by-you{font-size:11px;color:var(--teal);letter-spacing:.03em}
  .speech-area .npc-line{font-family:"Songti SC","Noto Serif CJK SC",serif;font-size:clamp(18px,2vw,26px);line-height:1.55;color:#fffaf0;letter-spacing:.018em;animation:line-in .32s ease both}
  @keyframes line-in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .speech-area .travel-hint{display:inline-flex;align-items:center;gap:7px;width:max-content;margin-top:2px;color:var(--gold);font-size:11px;font-family:Inter,"Microsoft YaHei",sans-serif}
  .prompt-row{display:flex;align-items:center;gap:7px;overflow-x:auto;padding:4px 22px 9px 200px;scrollbar-width:none;min-height:46px}.prompt-row::-webkit-scrollbar{display:none}
  .prompt{flex:none;border:1px solid rgba(157,216,208,.35);border-radius:100px;background:rgba(157,216,208,.08);color:#e1f5ef;font-size:12px;padding:6px 11px;white-space:nowrap;transition:.15s}
  .prompt:hover{border-color:var(--teal);transform:translateY(-2px);background:rgba(157,216,208,.17)}
  .input-row{display:flex;align-items:center;gap:9px;margin:0 22px 15px 200px;padding:5px;border:1px solid rgba(255,255,255,.23);border-radius:10px;background:rgba(1,10,16,.47)}
  .input-row:focus-within{border-color:var(--gold)}
  .input-row input{min-width:0;flex:1;border:0;outline:0;background:transparent;color:#fff;padding:7px 8px;font-size:13px}
  .input-row input::placeholder{color:#98aaa9}
  .send{border:0;border-radius:7px;background:var(--gold);color:#23190e;font-weight:850;padding:8px 13px;white-space:nowrap;font-size:12px}
  .send:hover{filter:brightness(1.12)}.send:disabled{opacity:.45;cursor:wait}
  .travel{position:absolute;z-index:7;right:clamp(20px,4vw,55px);bottom:calc(min(350px,45dvh) + 39px);padding:10px 15px;border:1px solid var(--gold);border-radius:10px;background:linear-gradient(110deg,#f4cd8f,#daaa64);color:#24160b;font-size:12px;font-weight:900;box-shadow:0 12px 35px #0008}
  .travel:hover{transform:translateY(-2px);filter:brightness(1.06)}
  .toast{position:absolute;z-index:15;top:85px;left:50%;transform:translateX(-50%);border:1px solid #f4d49c;border-radius:9px;padding:9px 15px;background:#15282b;color:#fbe4bd;box-shadow:0 15px 40px #0008;font-size:12px;max-width:90vw;text-align:center}
  .cover{position:absolute;z-index:20;inset:0;background:rgba(4,11,17,.72);backdrop-filter:blur(12px);display:grid;place-items:center;padding:18px;overflow:auto}
  .sheet{position:relative;width:min(820px,100%);max-height:min(89dvh,860px);overflow:auto;background:#e9d9b6;color:#28322d;border:1px solid #c3a975;border-radius:13px;box-shadow:0 26px 80px #000b,0 0 0 7px rgba(238,216,173,.08);padding:clamp(22px,4vw,46px)}
  .sheet:before{content:"";position:absolute;inset:9px;border:1px solid #baa474;border-radius:6px;pointer-events:none}
  .sheet h2{margin:5px 0 7px;font-family:"Songti SC",serif;font-size:clamp(27px,4vw,42px)}
  .sheet p{line-height:1.75;margin:0 0 22px;color:#4d5b52;font-size:13px}
  .sheet-kicker{font-weight:850;letter-spacing:.21em;color:#8c6531;font-size:11px}
  .close{position:absolute;right:22px;top:18px;z-index:2;border:1px solid #aa9873;border-radius:8px;background:rgba(255,255,255,.2);color:#3b4037;font-size:19px;width:32px;height:32px;line-height:1}
  .route{display:flex;gap:9px;align-items:stretch;margin:25px 0 10px}
  .route-node{flex:1;min-width:0;min-height:145px;border:1px solid #a99467;background:rgba(255,255,255,.15);border-radius:9px;padding:15px 11px;text-align:left;color:#27372f;transition:.15s}
  .route-node:hover:not(:disabled){background:#f7e7c4;transform:translateY(-3px)}
  .route-node.current{outline:3px solid #8e5b25;background:#f5e3bc}.route-node.fog{border-style:dashed;opacity:.5;cursor:not-allowed}
  .route-node small{display:block;letter-spacing:.15em;font-size:9px;font-weight:800;color:#86653c}
  .route-node strong{display:block;font-family:"Songti SC",serif;font-size:17px;margin:10px 0 4px}
  .route-node span{display:block;font-size:10px;line-height:1.55;color:#6a725f}
  .sheet-foot{margin-top:24px;padding-top:15px;border-top:1px dashed #a58f67;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;font-size:11px;color:#6b6e5e}
  .sheet-foot button,.scroll button,.epilogue-action{border:1px solid #7b683f;border-radius:7px;background:#eedab1;color:#3b2b19;padding:7px 11px;font-size:11px;font-weight:800}
  .sheet-foot button:hover,.scroll button:hover,.epilogue-action:hover{background:#f8eacb}
  .scroll-list{display:grid;gap:12px}.scroll{background:#f6e8c7;border:1px solid #bea879;border-left:5px solid #9e763c;border-radius:5px;padding:14px 17px}
  .scroll small{display:block;color:#8e6e39;font-size:10px;font-weight:850;letter-spacing:.1em}.scroll strong{display:block;font-family:"Songti SC",serif;font-size:18px;margin:5px 0}.scroll p{margin:0;color:#475146}.scroll .actions{display:flex;justify-content:space-between;align-items:center;margin-top:10px;gap:10px;font-size:10px;color:#7e7867}
  .log-entry{border-bottom:1px dashed #b9a87f;padding:10px 0}.log-entry b{font-size:11px;color:#8a6028}.log-entry p{margin:2px 0 0;font-size:13px;color:#303d34}
  .wipe{position:absolute;z-index:30;inset:0;display:grid;place-items:center;background:#101d22;overflow:hidden}
  .wipe:before{content:"";position:absolute;width:150vw;height:150vw;border:1px solid rgba(243,200,132,.18);border-radius:50%;box-shadow:0 0 0 12vw rgba(243,200,132,.025),0 0 0 24vw rgba(243,200,132,.02);animation:ripple 1s ease both}
  @keyframes ripple{from{transform:scale(.35);opacity:0}to{transform:scale(1);opacity:1}}
  .wipe-card{position:relative;text-align:center;color:var(--gold);animation:line-in .5s both}.wipe-card small{display:block;letter-spacing:.26em;font-size:11px}.wipe-card strong{display:block;font:42px "Songti SC",serif;margin:14px}.wipe-card span{font-size:12px;color:#dce9e3}
  .epilogue{height:100dvh;overflow:auto;padding:70px 20px;background:radial-gradient(circle at 80% 10%,#284147,#0b171d 60%);display:grid;place-items:center}
  .epilogue-card{width:min(780px,100%);padding:clamp(26px,5vw,58px);border:1px solid rgba(243,200,132,.5);border-radius:17px;background:#10242acc;box-shadow:0 25px 80px #0008}
  .epilogue-card h1{font:clamp(32px,4.8vw,54px) "Songti SC",serif;margin:10px 0}.epilogue-card p{color:var(--muted);line-height:1.8}
  .epilogue-row{border-top:1px solid var(--line);padding:12px 0}.epilogue-row b{display:block;color:var(--gold);font-size:12px}.epilogue-row span{font-size:13px;line-height:1.6;color:#e3eee7}
  .epilogue-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}.epilogue-action{font-size:13px;padding:11px 14px}
  @media(max-width:760px){
    .world{min-height:540px}.topbar{padding:12px 15px;gap:7px}.brand{font-size:14px;gap:7px}.brand .brand-mark{width:34px;height:34px}.case,.top-note{display:none}.top-action{font-size:10px;padding:7px 9px}
    .scene-bg.crop{background-size:auto 110%;background-position:right center}.scene-bg.storage{background-size:auto 135%}
    .scene-copy{left:19px;top:77px;max-width:78vw}.scene-copy h1{font-size:39px;margin:6px 0}.scene-copy p{font-size:12px;max-width:290px}.ambient-line{margin-top:11px}
    .npc-portrait{height:48vh;max-height:420px;right:-10vw;bottom:33vh;width:74vw;opacity:.87}.npc-presence{top:27vh;right:12px;width:125px;padding:8px}.npc-presence b{font-size:14px}.npc-presence span{font-size:9px}
    .dialogue{left:0;right:0;bottom:0;border-radius:17px 17px 0 0;height:min(390px,55dvh)}.dialogue-head{padding:9px 15px 6px;min-height:48px}.speaker-icon{height:31px;width:31px;font-size:17px}.speaker b{font-size:13px}.speaker small{font-size:9px}.mood{font-size:9px}.head-btn{font-size:10px}
    .dialogue-main{display:block;padding:8px 15px 3px}.speaker-side{display:none}.speech-area .npc-line{font-size:19px;line-height:1.5}.prompt-row{padding:3px 15px 8px;min-height:43px}.input-row{margin:0 15px 12px}.input-row input{font-size:12px}.send{font-size:11px}
    .toolbelt{left:11px;bottom:calc(min(390px,55dvh) + 12px)}.tool{min-width:57px;padding:5px 7px}.tool .ico{font-size:18px}.tool span:last-child{font-size:9px}.tool .count{margin:-37px 0 0 41px}
    .travel{right:11px;bottom:calc(min(390px,55dvh) + 15px);max-width:46vw;font-size:10px;padding:8px 10px}
    .sheet{max-height:94dvh}.route{display:grid;grid-template-columns:repeat(2,1fr)}.route-node{min-height:108px}.route-node strong{font-size:15px}
  }
  @media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<main id="app"></main>
<script>
const SCENES = [
  {
    id:"salt", place:"盐湖矿区", region:"01 / 上游资源", npc:"岚", role:"盐湖现货负责人",
    bg:"assets/salt-lake-mine-v1.png", crop:true, atmosphere:"风从盐田吹过，报价牌在你身旁亮着。",
    arrival:"你刚到矿区，岚已经在等。你不是来听行情故事的：半年后的电芯能不能按时交，得从这里开始问。",
    opening:"你就是栖岸储能的采购负责人？今天矿区的现货不等人。你是想先定量，还是先跟我谈价格？",
    generic:"岚敲了敲报价牌：我能谈供货，也能谈价格基准。你得告诉我，你最担心哪一件。",
    topics:[
      {id:"claim",label:"问涨价",prompt:"听说一周涨了三成，这个价怎么来的？",keys:["涨价","涨幅","三成","30%","价格","现货","行情"],reply:"岚看了一眼牌子：上面只有一根往上的线。三成是市场上在传的说法，我现在能报今天的价；你若要锁半年，我得先知道你要锁多少量。",repeat:"我说的是现货气氛，不是一份带日期和指数的报告。你要可核对的报价，就得把基准写出来。",scroll:{id:"salt-rumor",title:"矿区的涨价说法",body:"岚口头提到“涨了三成”，现场看板没有指数名称和日期。",kind:"口头说法"}},
      {id:"proof",label:"问价格依据",prompt:"交货日价格按哪个指数和日期算？",keys:["依据","指数","日期","合同","样张","凭证","基准","条款"],reply:"他把一张合同样张推到你面前：只写着“以交货日行情为准”，没写指数、取价日，也没有上限。岚抬眼看你：你要补哪一条？",repeat:"那张样张仍在桌上。指数、取价日和上限，现在一个都没写。",scroll:{id:"salt-contract",title:"现货合同样张",body:"本局模拟样张仅写“价格以交货日行情为准”，未指定指数、取价日或上限。",kind:"剧情单据"}},
      {id:"risk",label:"问交货风险",prompt:"如果我现在锁量，交期能保证吗？",keys:["交期","交货","供货","保供","锁量","数量","货源"],reply:"岚收起笑：数量可以排，价格却要按交货日算。我现在答应你有货，不等于答应你半年后的成本不变。你们能承受多大的波动？",repeat:"供货量和价格边界是两件事。你要我承诺，就把这两件事分开写。"}
    ],
    offerPrompt:"我愿意报采购量，但基准价和季度复核要写清楚。",
    early:"岚把笔放下：我们才说了两句。你还没问清怎么算价，怎么知道自己开的条件值不值？",
    offerStrong:"岚把样张上的“随行就市”圈了起来：行，数量先报；指数、取价日和季度复核写成待确认条款。今天我给你的只是口头条件，正式合同还得双方核对。",
    offerWeak:"岚点头：数量可以先排，我按今天的现货报价给你留位置。至于交货时的价格，我们还没划清上限。",
    termsStrong:"先报量；价格指数、取价日和季度复核写入待确认条款。",
    termsWeak:"先排供货量；交货日价格仍未设上限。",
    risk:"涨价幅度和合同基准尚未从外部来源核实。",
    lead:"岚朝山下的厂房指了指：矿盐往下走，先到材料工坊。那位坊主岑比我更会算成本。你把这张样张带去，他就没法只说“都涨了”。",
    next:"材料工坊", cross:{}
  },
  {

      return scene.cross[itemId]+(p.deal && p.deal.kind==="weak"?" 你现在有新筹码，可以再提一次条件。":"");
    }
    if(item.from===scene.place) return scene.npc+"把卷轴看了一眼：这就是我们刚才谈过的东西。你可以问我它的来源，也可以说你想怎么写进条款。";
    return scene.npc+"看完卷轴：这是"+item.from+"的材料。它能帮你追问，却不能直接证明我这里的库存、报价或交期。你想拿它问我什么？";
  }
  if(intent==="lead"){
    if(!canRevealLead(scene,p)) return scene.npc+"按住地图：先弄清我这里的价格依据或交付条件。你至少得带着一个问题去下一站。";
    p.leadHeard=true;
    unlockAfter(scene);
    return scene.lead;
  }
  if(intent==="offer"){
    if(conversationDepth(scene,p)<2) return scene.early;
    const strong=p.seen.includes("proof") || relevantPresentations(scene,p)>0;
    p.deal={kind:strong?"strong":"weak",terms:strong?scene.termsStrong:scene.termsWeak,risk:scene.risk};
    p.leadHeard=true;
    unlockAfter(scene);
    return (strong?scene.offerStrong:scene.offerWeak)+" "+scene.lead;
  }
  const topic=scene.topics.find(x=>x.id===intent);
  if(topic){
    if(p.seen.includes(topic.id)) return topic.repeat;
    p.seen.push(topic.id);
    if(topic.scroll) addScroll(topic.scroll);
    return topic.reply;
  }
  const last=p.history.filter(x=>x.speaker==="npc").slice(-1)[0];
  if(last && p.seen.length>=2) return scene.generic+" 你也可以直接提出你的采购条件，我会回应。";
  return scene.generic;
}
async function npcReply(scene,playerMessage,fallback,history){
  if(!npcModel) return fallback;
  try{
    const controller=new AbortController();
    const timer=setTimeout(function(){controller.abort();},7500);
    let response;
    try{
      response=await fetch(API_BASE+"/api/procurement/npc",{
        method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({
          scene_id:scene.id,player_message:playerMessage.slice(0,240),fallback_reply:fallback,
          history:history.slice(-8),known_scrolls:S.scrolls.slice(0,20)
        }),signal:controller.signal
      });
    }finally{clearTimeout(timer);}
    if(!response.ok) return fallback;
    const result=await response.json();
    return result.mode==="model" && typeof result.reply==="string" && result.reply.trim()?result.reply.slice(0,450):fallback;
  }catch(_error){return fallback;}
}
async function checkNpcMode(){
  if(!location.protocol.startsWith("http")) return;
  try{
    const response=await fetch(API_BASE+"/api/procurement/npc/status",{cache:"no-store"});
    if(response.ok){
      const data=await response.json();
      npcModel=!!data.enabled;
      const badge=document.getElementById("npcMode");
      if(badge) badge.textContent=currentScene().role+" · "+(npcModel?"模型对话":"离线剧情对话");
    }
  }catch(_error){}
}
async function speak(text,forced,itemId){
  const message=String(text||"").trim().slice(0,240);
  if(!message || busy || transitioning || S.report) return;
  busy=true;
  overlay=null;
  const scene=currentScene(),p=progress(scene);
  appendHistory(p,"you",message);
  const fallback=resolveTurn(scene,p,message,forced,itemId);
  saveState();
  render();
  const answer=await npcReply(scene,message,fallback,p.history);
  appendHistory(p,"npc",answer);
  busy=false;
  saveState();
  render();
  const input=document.getElementById("playerInput");
  if(input) input.focus({preventScroll:true});
}
function topicPrompts(scene,p){
  const unseen=scene.topics.filter(x=>!p.seen.includes(x.id));
  const prompts=unseen.slice(0,3).map(x=>({label:x.label,text:x.prompt,intent:x.id}));
  prompts.push({label:p.deal?"再谈条件":"提出条件",text:scene.offerPrompt,intent:"offer"});
  if(canRevealLead(scene,p)) prompts.push({label:"问下一站",text:"这条链下一站该去哪里？",intent:"lead"});
  return prompts;
}
function overlayFrame(title,kicker,body,footer){
  return '<div class="cover" role="dialog" aria-modal="true" aria-label="'+esc(title)+'"><div class="sheet">' +
    '<button class="close" data-act="close" aria-label="关闭">×</button>' +
    '<div class="sheet-kicker">'+esc(kicker)+'</div><h2>'+esc(title)+'</h2>' +
    body+'<div class="sheet-foot">'+footer+'</div></div></div>';
}
function renderMap(){
  let nodes="";
  SCENES.forEach(function(scene,index){
    const known=index<=S.unlocked,here=index===S.current;
    const p=S.scenes[scene.id],state=!known?"尚未发现":(p&&p.deal?"已谈过条件":(p&&p.leadHeard?"已走访":"可走访"));
    nodes+='<button class="route-node '+(here?"current ":"")+(known?"":"fog")+'" data-act="map-node" data-index="'+index+'" '+(known?"":"disabled")+'>'+
      '<small>CHAPTER '+String(index+1).padStart(2,"0")+'</small><strong>'+esc(known?scene.place:"未探明")+'</strong>'+
      '<span>'+esc(here?"你正在这里":state)+'</span></button>';
  });
  const body='<p>你亲手走过的地方才会在地图上亮起。下一站的名字，要从眼前这个人嘴里问出来。</p>'+
    '<div class="route">'+nodes+'</div>';
  const footer='<span>已发现 '+(S.unlocked+1)+' / '+SCENES.length+' 个地点 · 本局进度保存在浏览器</span>'+
    '<button data-act="reset">重新开始这一趟</button>';
  return overlayFrame("手里的产业链地图","THE ROUTE · 栖岸储能",body,footer);
}
function renderBag(){
  const list=S.scrolls.map(function(id){
    const item=ALL_SCROLLS.get(id);
    if(!item) return "";
    return '<article class="scroll"><small>'+esc(item.kind)+' · '+esc(item.from)+'</small>'+
      '<strong>'+esc(item.title)+'</strong><p>'+esc(item.body)+'</p>'+
      '<div class="actions"><span>本局情景材料 · 尚需真实来源核对</span>'+
      '<button data-act="present" data-scroll="'+esc(id)+'">出示给'+esc(currentScene().npc)+'</button></div></article>';
  }).join("");
  const body='<p>和人物交谈时得到的说法与单据会放在这里。出示卷轴，对方会按自己的立场回应。</p>'+
    '<div class="scroll-list">'+(list||'<div class="scroll"><strong>背包还是空的</strong><p>先回去和眼前的人谈谈价格、条款或交付。</p></div>')+'</div>';
  return overlayFrame("走访卷轴","SATCHEL · "+S.scrolls.length+" 份",body,'<span>卷轴记录的是游戏内情景，不代表真实企业文件。</span><button data-act="close">回到对话</button>');
}
function renderHistory(){
  const scene=currentScene(),p=progress(scene);
  const list=p.history.map(function(turn){
    return '<div class="log-entry"><b>'+esc(turn.speaker==="you"?"你":scene.npc)+'</b><p>'+esc(turn.text)+'</p></div>';
  }).join("");
  const body='<p>这一站的交谈。你可以回看刚才答应了什么，也可以回到画面继续追问。</p>'+
    '<div style="max-height:55dvh;overflow:auto">'+list+'</div>';
  return overlayFrame("与"+scene.npc+"的对话","CONVERSATION LOG · "+scene.place,body,'<span>同一站的对话会一直保留。</span><button data-act="close">继续交谈</button>');
}
function renderReport(){
  const rows=SCENES.map(function(scene){
    const p=S.scenes[scene.id],deal=p&&p.deal;
    return '<div class="epilogue-row"><b>'+esc(scene.region)+' · '+esc(scene.place)+'</b>'+
      '<span>'+esc(deal?deal.terms:"你已到访；这一站尚未形成口头条件。")+'</span></div>';
  }).join("");
  app.innerHTML='<section class="epilogue"><div class="epilogue-card">'+
    '<div class="eyebrow">采购走访结束 · 情景推演</div><h1>你把地图走成了一份谈判记录</h1>'+
    '<p>从盐湖到客户，再到第二条需求线，你听到了不同环节想承担与想转嫁的风险。下一步不是选一个标准答案，而是核对原始合同、报价明细、交付计划和分部回款来源。</p>'+
    rows+'<p>本局人物、合同和数字均为虚构场景；口头回应不是正式合同。你在背包里收集了 '+S.scrolls.length+' 份剧情卷轴。</p>'+
    '<div class="epilogue-actions"><button class="epilogue-action" data-act="back-scene">回到最后一站</button>'+
    '<button class="epilogue-action" data-act="open-map">展开走访地图</button>'+
    '<button class="epilogue-action" data-act="reset">重新走访</button></div></div></section>'+
    (overlay?renderOverlay():"");
}
function renderOverlay(){
  if(overlay==="map") return renderMap();
  if(overlay==="bag") return renderBag();
  if(overlay==="history") return renderHistory();
  return "";
}
function renderScene(){
  const scene=currentScene(),p=progress(scene);
  const lastNpc=p.history.filter(x=>x.speaker==="npc").slice(-1)[0]||{text:scene.opening};
  const lastYou=p.history.filter(x=>x.speaker==="you").slice(-1)[0];
  const reveal=S.current<SCENES.length-1?S.unlocked>S.current:S.finished;
  const nextLabel=S.current<SCENES.length-1?"翻地图 · 前往"+SCENES[S.current+1].place:"结束走访 · 回办公室";
  const mood=p.deal?"已经谈过条件":(seenCount(p)>=2?"开始认真谈":"正在观察你");
  const prompts=topicPrompts(scene,p).map(function(x){
    return '<button class="prompt" data-act="prompt" data-intent="'+esc(x.intent)+'" data-text="'+esc(x.text)+'">'+esc(x.label)+'</button>';
  }).join("");
  app.innerHTML='<section class="world" id="world">'+
    '<div class="scene-bg '+(scene.crop?"crop ":"")+(scene.storage?"storage":"")+'" style="background-image:url(&quot;'+esc(scene.bg)+'&quot;)"></div>'+
    '<div class="scene-shade"></div>'+
    '<header class="topbar"><div class="brand"><span class="brand-mark"><img src="assets/jiheng-world-logo.png" alt="" aria-hidden="true"></span><span>玑衡 <small>WORLD · 走访</small></span></div>'+
    '<div class="case"><b>栖岸储能 · 半年采购方案</b><span>你是采购负责人，正沿产业链找人谈条件</span></div>'+
    '<div class="spacer"></div><span class="top-note">情景模拟 · 人物与条款为虚构</span>'+
    '<button class="top-action" data-act="open-map">地图 '+(S.current+1)+' / '+SCENES.length+'</button></header>'+
    '<div class="scene-copy"><div class="eyebrow">'+esc(scene.region)+'</div><h1>'+esc(scene.place)+'</h1>'+
    '<p>'+esc(scene.arrival)+'</p><div class="ambient-line">'+esc(scene.atmosphere)+'</div></div>'+
    (scene.portrait?'<img class="npc-portrait" src="'+esc(scene.portrait)+'" alt="'+esc(scene.npc)+'的角色立绘">':"")+
    '<nav class="toolbelt" aria-label="走访工具"><button class="tool" data-act="open-map" aria-label="展开地图"><span class="ico">▤</span><span>地图</span></button>'+
    '<button class="tool" data-act="open-bag" aria-label="打开卷轴背包"><span class="ico">▣</span><span>背包</span>'+(S.scrolls.length?'<span class="count">'+S.scrolls.length+'</span>':"")+'</button></nav>'+
    (reveal?'<button class="travel" data-act="travel">'+esc(nextLabel)+' →</button>':"")+
    '<section class="dialogue" aria-label="与'+esc(scene.npc)+'交谈"><div class="dialogue-head">'+
    '<span class="speaker-icon">'+esc(scene.npc.slice(0,1))+'</span><div class="speaker"><b>'+esc(scene.npc)+'</b>'+
    '<small id="npcMode">'+esc(scene.role)+' · '+(npcModel?"模型对话":"离线剧情对话")+'</small></div><span class="mood">'+esc(mood)+'</span>'+
    '<button class="head-btn" data-act="open-history">回看对话</button></div>'+
    '<div class="dialogue-main"><div class="speaker-side"><b>此行目的</b>为栖岸储能谈半年采购。听他说，也告诉他你的条件。<br><br>你可以打字、追问，或出示背包里的卷轴。</div>'+
    '<div class="speech-area" aria-live="polite">'+(lastYou?'<div class="said-by-you">你刚才说：'+esc(lastYou.text)+'</div>':"")+
    '<div class="npc-line">'+esc(busy?"（"+scene.npc+"正在想你提出的条件……）":lastNpc.text)+'</div>'+
    (reveal?'<div class="travel-hint">地图上亮起了下一段路 →</div>':"")+'</div></div>'+
    '<div class="prompt-row">'+prompts+'<button class="prompt" data-act="open-bag">出示卷轴</button></div>'+
    '<form class="input-row" id="speakForm"><input id="playerInput" maxlength="240" autocomplete="off" aria-label="对'+esc(scene.npc)+'说话" placeholder="直接对'+esc(scene.npc)+'说话，例如：这个价格依据是什么？" '+(busy?"disabled":"")+'>'+
    '<button class="send" type="submit" '+(busy?"disabled":"")+'>'+ (busy?"回应中":"发送 ↗")+'</button></form></section>'+
    (toastText?'<div class="toast" id="toast" role="status">'+esc(toastText)+'</div>':"")+
    (overlay?renderOverlay():"")+'</section>';
}
function render(){ if(S.report) renderReport(); else renderScene(); }
function transitionTo(index){
  if(transitioning || busy || index<0 || index>S.unlocked || index>=SCENES.length) return;
  overlay=null;
  if(index===S.current){render();return;}
  transitioning=true;
  const target=SCENES[index];
  app.insertAdjacentHTML("beforeend",'<div class="wipe" aria-live="polite"><div class="wipe-card"><small>展开手中的地图 · '+esc(target.region)+'</small><strong>'+esc(target.place)+'</strong><span>下一段产业链正在你面前展开</span></div></div>');
  setTimeout(function(){
    S.current=index;
    progress(target);
    saveState();
    transitioning=false;
    render();
    const world=document.getElementById("world");
    if(world){world.classList.add("entering");setTimeout(function(){world.classList.remove("entering");},1000);}
  },850);
}
function finishJourney(){
  if(!S.finished || busy || transitioning) return;
  transitioning=true;
  app.insertAdjacentHTML("beforeend",'<div class="wipe"><div class="wipe-card"><small>走访结束 · 返回办公室</small><strong>摊开你的卷轴</strong><span>写下每一站口头谈成的条件</span></div></div>');
  setTimeout(function(){S.report=true;saveState();transitioning=false;overlay=null;render();},850);
}
app.addEventListener("click",function(event){
  const button=event.target.closest("[data-act]");
  if(!button || transitioning) return;
  const act=button.dataset.act;
  if(act==="close"){overlay=null;render();return;}
  if(act==="open-map"){overlay="map";render();return;}
  if(act==="open-bag"){if(S.report){S.report=false;} overlay="bag";render();return;}
  if(act==="open-history"){overlay="history";render();return;}
  if(act==="prompt"){speak(button.dataset.text,button.dataset.intent);return;}
  if(act==="present"){
    const item=ALL_SCROLLS.get(button.dataset.scroll);
    if(item) speak("我把「"+item.title+"」拿给你看。","present",item.id);
    return;
  }
  if(act==="map-node"){
    const index=Number(button.dataset.index);
    if(Number.isInteger(index) && index<=S.unlocked){
      if(S.report){S.report=false;saveState();}
      transitionTo(index);
    }
    return;
  }
  if(act==="travel"){
    if(S.current===SCENES.length-1){finishJourney();return;}
    if(S.unlocked>S.current) transitionTo(S.current+1);
    return;
  }
  if(act==="back-scene"){S.report=false;overlay=null;saveState();render();return;}
  if(act==="reset"){
    if(confirm("重新开始会清空这一趟走访的对话和卷轴。确定重新开始吗？")){
      try{localStorage.removeItem(STORAGE_KEY);}catch(_error){}
      S=freshState();overlay=null;toastText="";busy=false;transitioning=false;render();
    }
  }
});
app.addEventListener("submit",function(event){
  if(event.target.id!=="speakForm") return;
  event.preventDefault();
  const input=document.getElementById("playerInput");
  if(input) speak(input.value);
});
document.addEventListener("keydown",function(event){
  if(event.key==="Escape" && overlay){overlay=null;render();}
});
progress(currentScene());
render();
checkNpcMode();
</script>
</body>
