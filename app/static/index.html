<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>玑衡 AI · A 股研究辅助台</title>
  <style>
    :root { --ink:#17202a; --muted:#72808d; --line:#e5e9ee; --paper:#f6f8fb; --card:#fff; --blue:#246bce; --blue-soft:#eaf2ff; --green:#14866d; --red:#ba4e56; --amber:#9a6a12; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--paper); color:var(--ink); font:14px/1.55 Inter,"Microsoft YaHei",sans-serif; }
    .shell { max-width:1440px; margin:0 auto; padding:26px 30px 50px; }
    .topbar { display:flex; justify-content:space-between; align-items:flex-start; gap:20px; margin-bottom:20px; }
    .brand { display:flex; gap:13px; align-items:center; }
    .mark { width:42px; height:42px; border-radius:14px; display:grid; place-items:center; color:white; font-weight:800; background:linear-gradient(135deg,#1d4e89,#55a6e9); box-shadow:0 8px 20px #246bce33; }
    h1 { margin:0; font-size:25px; letter-spacing:.02em; }
    .subtitle { color:var(--muted); margin-top:3px; }
    .notice { background:#fff8e8; border:1px solid #f1dfad; color:#725518; border-radius:12px; padding:10px 14px; font-size:12px; max-width:600px; }
    .grid { display:grid; grid-template-columns:310px minmax(0,1fr); gap:18px; align-items:start; }
    .card { background:var(--card); border:1px solid var(--line); border-radius:16px; box-shadow:0 8px 28px #17202a08; }
    .sidebar { padding:18px; position:sticky; top:18px; }
    .label { color:var(--muted); font-size:12px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; }
    textarea { width:100%; min-height:102px; resize:vertical; border:1px solid #ccd5df; border-radius:12px; padding:12px; margin:9px 0 10px; font:inherit; outline:none; }
    textarea:focus { border-color:var(--blue); box-shadow:0 0 0 3px var(--blue-soft); }
    button { border:0; border-radius:10px; padding:10px 13px; cursor:pointer; font-weight:700; font:inherit; }
    .primary { background:var(--blue); color:white; width:100%; }
    .primary:hover { background:#1e5db4; }
    .preset { display:block; width:100%; text-align:left; margin-top:8px; background:#f3f6fa; color:#405263; font-size:13px; }
    .preset:hover { background:var(--blue-soft); color:var(--blue); }
    .small-note { color:var(--muted); font-size:12px; margin-top:16px; }
    .content { display:grid; gap:18px; min-width:0; }
    .hero { padding:20px; display:flex; justify-content:space-between; gap:20px; align-items:flex-end; }
    .hero h2 { margin:4px 0 0; font-size:21px; }
    .pill { display:inline-flex; align-items:center; gap:6px; border-radius:999px; padding:5px 10px; color:var(--green); background:#e7f6f1; font-size:12px; font-weight:700; }
    .interpret { color:var(--muted); font-size:13px; }
    .table-wrap { overflow:auto; }
    table { width:100%; border-collapse:collapse; min-width:730px; }
    th,td { text-align:left; padding:13px 16px; border-top:1px solid var(--line); white-space:nowrap; }
    th { color:var(--muted); font-size:12px; font-weight:700; }
    tbody tr { cursor:pointer; transition:background .15s; }
    tbody tr:hover, tbody tr.active { background:#f4f8ff; }
    .stock { font-weight:800; color:#1e4f8d; }
    .code { color:var(--muted); font-size:12px; margin-left:6px; }
    .up { color:var(--green); } .down { color:var(--red); }
    .evidence { color:#5d6c7a; font-size:12px; border-left:2px solid #a5c7f5; padding-left:8px; margin-top:4px; }
    .detail { padding:20px; }
    .detail-head { display:flex; justify-content:space-between; gap:16px; align-items:flex-start; }
    .detail h2 { margin:0; font-size:22px; }
    .detail h3 { font-size:14px; margin:20px 0 10px; }
    .metrics { display:grid; grid-template-columns:repeat(7,minmax(90px,1fr)); gap:9px; margin:18px 0; }
    .metric { border:1px solid var(--line); border-radius:11px; padding:10px; background:#fbfcfe; }
    .metric span { color:var(--muted); font-size:11px; display:block; }
    .metric strong { display:block; margin-top:4px; font-size:17px; }
    .columns { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
    .panel { border:1px solid var(--line); border-radius:12px; padding:13px; }
    .panel h4 { margin:0 0 9px; font-size:13px; }
    .panel ul { margin:0; padding-left:18px; color:#455361; }
    .panel li { margin:6px 0; }
    .panel.positive { border-color:#c7e8dc; background:#f6fcfa; } .panel.negative { border-color:#f0d1d2; background:#fff9f9; }
    .derived { display:grid; grid-template-columns:repeat(2,1fr); gap:10px; }
    .derived-item { padding:12px; border-radius:12px; background:#f3f7ff; border:1px solid #d6e4f8; }
    .derived-item small { color:var(--blue); font-weight:800; }
    .derived-item b { display:block; margin:3px 0; }
    .confidence { color:var(--muted); font-size:12px; }
    .debate { padding:20px; }
    .debate-head { display:flex; justify-content:space-between; align-items:center; }
    .debate-grid { display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-top:14px; }
    .argument { border-radius:12px; padding:14px; }
    .argument ul { padding-left:18px; margin:8px 0 0; }
    .bull { background:#f0fbf7; border:1px solid #c6eadc; } .bear { background:#fff6f5; border:1px solid #f0d2cf; }
    .judge { margin-top:14px; padding:13px 15px; border-radius:12px; background:#f7f7fa; color:#4c5664; }
    .empty { padding:38px 20px; text-align:center; color:var(--muted); }
    @media (max-width:900px) { .shell { padding:18px 14px 35px; } .topbar,.hero { display:block; } .notice { margin-top:14px; } .grid { grid-template-columns:1fr; } .sidebar { position:static; } .metrics { grid-template-columns:repeat(4,1fr); } }
    @media (max-width:580px) { .columns,.debate-grid,.derived { grid-template-columns:1fr; } .metrics { grid-template-columns:repeat(2,1fr); } }
  </style>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="brand"><div class="mark">玑</div><div><h1>玑衡 AI</h1><div class="subtitle">可溯源的 A 股研究辅助台</div></div></div>
      <div class="notice">研究辅助工具 · 当前为演示数据，非实时行情 · 所有内容不构成投资建议</div>
    </header>
    <div class="grid">
      <aside class="card sidebar">
        <div class="label">Research query</div>
        <textarea id="query">PE&lt;25 且 ROE&gt;15% 且现金流为正</textarea>
        <button class="primary" id="run">开始拆解问题</button>
        <div class="label" style="margin-top:22px">演示问题</div>
        <button class="preset" data-query="PE&lt;25 且 ROE&gt;15% 且现金流为正">低估值 + 质量</button>
        <button class="preset" data-query="高成长科技股">高成长科技股</button>
        <button class="preset" data-query="高股息且现金流为正">高股息现金流</button>
        <button class="preset" data-query="帮我研究宁德时代">个股研究：宁德时代</button>
        <div class="small-note">流程：自然语言 → 结构化条件 → 证据集 → 个股诊断 → Bull / Bear 反驳</div>
      </aside>
      <main class="content">
        <section class="card hero">
          <div><span class="pill">● Agent ready</span><h2 id="queryTitle">等待研究问题</h2><div class="interpret" id="interpret">输入一个筛选条件，查看模型如何拆解。</div></div>
          <div class="small-note" id="resultCount"></div>
        </section>
        <section class="card table-wrap" id="resultsCard"><div class="empty">输入问题后，这里会显示带匹配理由的股票池。</div></section>
        <section class="card detail" id="detailCard"><div class="empty">点击上方股票查看可溯源诊断。</div></section>
        <section class="card debate" id="debateCard"><div class="empty">选择股票后，查看多空双方基于同一证据集的论证。</div></section>
      </main>
    </div>
  </div>
  <script>
    const $ = (id) => document.getElementById(id);
    const esc = (value) => String(value ?? '').replace(/[&<>'"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
    let selectedCode = null;
    function percent(value) { return `${Number(value).toFixed(1)}%`; }
    function renderInterpret(filters) {
      const labels = {pe_max:'PE上限', roe_min:'ROE下限', profit_growth_min:'净利润增速下限', dividend_yield_min:'股息率下限', cashflow_positive_3y:'近三年现金流为正', industry_keywords:'行业范围', codes:'指定代码'};
      const pairs = Object.entries(filters).map(([key, value]) => `${labels[key] || key}: ${Array.isArray(value) ? value.join('、') : value === true ? '是' : value}`);
      return pairs.length ? `已识别条件：${pairs.join(' · ')}` : '未识别到硬条件，将展示演示股票池。';
    }
    function renderResults(body) {
      $('queryTitle').textContent = `研究问题：${body.query}`;
      $('interpret').textContent = renderInterpret(body.interpreted);
      $('resultCount').textContent = `${body.results.length} 个匹配结果`;
      if (!body.results.length) { $('resultsCard').innerHTML = '<div class="empty">没有同时满足这些条件的演示股票。可以放宽条件或更换问题。</div>'; return; }
      $('resultsCard').innerHTML = `<table><thead><tr><th>标的</th><th>行业</th><th>价格</th><th>PE(TTM)</th><th>ROE</th><th>净利润增速</th><th>匹配理由</th></tr></thead><tbody>${body.results.map(item => `<tr data-code="${item.code}"><td><span class="stock">${esc(item.name)}</span><span class="code">${item.code}</span></td><td>${esc(item.industry)}</td><td>${item.price.toFixed(2)} <span class="${item.change_1d >= 0 ? 'up':'down'}">${item.change_1d >= 0 ? '+':''}${item.change_1d.toFixed(2)}%</span></td><td>${item.pe_ttm.toFixed(1)}</td><td>${percent(item.roe)}</td><td>${percent(item.profit_growth)}</td><td><div class="evidence">${item.match_reason.map(esc).join(' · ')}</div></td></tr>`).join('')}</tbody></table>`;
      document.querySelectorAll('tbody tr').forEach(row => row.addEventListener('click', () => selectStock(row.dataset.code)));
      selectStock(body.results[0].code);
    }
    async function runQuery(value) {
      $('run').disabled = true; $('run').textContent = 'Agent 拆解中…';
      try { const response = await fetch('/api/screen', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({query:value})}); renderResults(await response.json()); }
      catch (error) { $('resultsCard').innerHTML = `<div class="empty">请求失败：${esc(error.message)}</div>`; }
      finally { $('run').disabled = false; $('run').textContent = '开始拆解问题'; }
    }
    async function selectStock(code) {
      selectedCode = code; document.querySelectorAll('tbody tr').forEach(row => row.classList.toggle('active', row.dataset.code === code));
      const report = await (await fetch(`/api/stocks/${code}/diagnosis`)).json();
      const m = report.metrics;
      $('detailCard').innerHTML = `<div class="detail-head"><div><div class="label">Evidence-grounded diagnosis</div><h2>${esc(report.name)} <span class="code">${report.code} · ${esc(report.industry)}</span></h2><p>${esc(report.summary)}</p></div><span class="pill">${esc(report.as_of)}</span></div><div class="metrics"><div class="metric"><span>价格</span><strong>${m.price.toFixed(2)}</strong></div><div class="metric"><span>日涨跌</span><strong class="${m.change_1d >= 0 ? 'up':'down'}">${m.change_1d >= 0 ? '+':''}${m.change_1d.toFixed(2)}%</strong></div><div class="metric"><span>PE(TTM)</span><strong>${m.pe_ttm.toFixed(1)}</strong></div><div class="metric"><span>PB</span><strong>${m.pb.toFixed(1)}</strong></div><div class="metric"><span>ROE</span><strong>${percent(m.roe)}</strong></div><div class="metric"><span>营收增速</span><strong>${percent(m.revenue_growth)}</strong></div><div class="metric"><span>股息率</span><strong>${percent(m.dividend_yield)}</strong></div></div><div class="columns"><div class="panel positive"><h4>支持因素 · ${report.signals.length}</h4><ul>${report.signals.map(item => `<li><b>${esc(item.title)}</b>：${esc(item.detail)}<div class="evidence">来源 ${esc(item.evidence_id)}</div></li>`).join('') || '<li>暂无自动识别的支持因素</li>'}</ul></div><div class="panel negative"><h4>待核验风险 · ${report.risks.length}</h4><ul>${report.risks.map(item => `<li><b>${esc(item.title)}</b>：${esc(item.detail)}<div class="evidence">来源 ${esc(item.evidence_id)}</div></li>`).join('') || '<li>暂无自动识别的风险，不代表不存在风险</li>'}</ul></div></div><h3>AI 衍生数据 <span class="code">与硬数据分开标注</span></h3><div class="derived">${report.derived.map(item => `<div class="derived-item"><small>${esc(item.kind)}</small><b>${esc(item.label)}：${esc(item.value)}</b><div class="confidence">置信度 ${Math.round(item.confidence * 100)}% · ${esc(item.formula)}</div></div>`).join('')}</div><h3>证据链</h3><div>${report.evidence.map(item => `<div class="evidence" style="margin:8px 0">[${esc(item.id)}] ${esc(item.label)} · ${esc(item.source_type)} · ${esc(item.excerpt)}</div>`).join('')}</div>`;
      const debate = await (await fetch(`/api/stocks/${code}/debate`)).json();
      $('debateCard').innerHTML = `<div class="debate-head"><div><div class="label">Adversarial review</div><h2>多空辩论 · ${esc(debate.name)}</h2></div><span class="pill">同一证据集</span></div><div class="debate-grid"><div class="argument bull"><b>▲ Bull · 支持逻辑</b><ul>${debate.bull.map(item => `<li>${esc(item.point)}<div class="evidence">${item.evidence_ids.map(esc).join(' · ')}</div></li>`).join('')}</ul></div><div class="argument bear"><b>▼ Bear · 反驳逻辑</b><ul>${debate.bear.map(item => `<li>${esc(item.point)}<div class="evidence">${item.evidence_ids.map(esc).join(' · ')}</div></li>`).join('')}</ul></div></div><div class="judge"><b>裁决：</b>${esc(debate.judge)}<br><br><b>要证伪当前逻辑，需要继续检查：</b>${debate.falsify.map(esc).join(' · ')}</div>`;
    }
    $('run').addEventListener('click', () => runQuery($('query').value.trim()));
    document.querySelectorAll('.preset').forEach(button => button.addEventListener('click', () => { $('query').value = button.dataset.query; runQuery(button.dataset.query); }));
    runQuery($('query').value);
  </script>
</body>
</html>
