[project]
name = "jiheng-python"
version = "0.0.1"
description = "Jiheng AI Python Agent Service"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "httpx>=0.27.0",
    "redis>=5.2.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "sse-starlette>=2.1.0",
    "PyJWT>=2.10.0",
    "structlog>=24.4.0",
    "mcp>=1.1.2",
    "pymupdf>=1.24.0",
    "beautifulsoup4>=4.12.0",
]

[project.optional-dependencies]
# The preview SDK is installed from the pinned official source commit by the Dockerfile
# or harness/install-harness.ps1; it is intentionally not resolved from PyPI.
harness = []
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "ruff>=0.8.0",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
